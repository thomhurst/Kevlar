calculation:
  branches:
    main:
      increment: Patch
      label: ''
      mode: ContinuousDeployment
    develop:
      increment: Minor
      label: alpha
      mode: ContinuousDelivery
    feature:
      increment: Inherit
      label: "alpha.{BranchName}"
      regex: "^features?[/-](?<BranchName>.+)"
    release:
      increment: None
      label: rc
      regex: "^releases?[/-]"
    hotfix:
      increment: Patch
      label: beta
      regex: "^hotfix(es)?[/-]"
    pull-request:
      increment: Inherit
      label: "pr.{Number}"
      regex: "^(pull|pull-requests|pr)[/-](?<Number>\\d+)"
  # Commit messages never choose the version. Main suggests the next patch after the latest
  # release tag for the draft release (.github/workflows/release-draft.yml); the owner picks a
  # minor or major version by editing the draft's tag before publishing it. Only tags move the
  # version: merge messages and branch names are ignored as well.
  commit-message-incrementing: Disabled
  mode: ContinuousDelivery
  strategies:
    - Fallback
    - TaggedCommit
