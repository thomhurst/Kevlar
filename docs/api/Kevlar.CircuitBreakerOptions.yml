- uid: Kevlar.CircuitBreakerOptions.BreakDurationGenerator
  commentId: P:Kevlar.CircuitBreakerOptions.BreakDurationGenerator
  id: BreakDurationGenerator
  parent: Kevlar.CircuitBreakerOptions
  langs:
  - csharp
  - vb
  name: BreakDurationGenerator
  nameWithType: CircuitBreakerOptions.BreakDurationGenerator
  fullName: Kevlar.CircuitBreakerOptions.BreakDurationGenerator
  type: Property
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Produces the break duration when a handled outcome trips or re-opens the circuit, and is

    awaited before the circuit opens. The returned value must be positive. Return

    <code>new(duration)</code> from a synchronous generator. The event context is valid only until

    the returned task completes. When configured, this value overrides

    <xref href="Kevlar.CircuitBreakerOptions.BreakDuration" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public Func<CircuitBreakerBreakDurationEvent, ValueTask<TimeSpan>>? BreakDurationGenerator { get; set; }
    parameters: []
    return:
      type: System.Func{Kevlar.CircuitBreakerBreakDurationEvent,System.Threading.Tasks.ValueTask{System.TimeSpan}}
    content.vb: Public Property BreakDurationGenerator As Func(Of CircuitBreakerBreakDurationEvent, ValueTask(Of TimeSpan))
  overload: Kevlar.CircuitBreakerOptions.BreakDurationGenerator*
