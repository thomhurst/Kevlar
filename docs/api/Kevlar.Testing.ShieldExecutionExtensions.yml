- uid: Kevlar.Testing.ShieldExecutionExtensions.WaitForPendingAsync(System.Threading.Tasks.Task,System.Func{System.Boolean},System.String,System.Int32,System.Threading.CancellationToken)
  commentId: M:Kevlar.Testing.ShieldExecutionExtensions.WaitForPendingAsync(System.Threading.Tasks.Task,System.Func{System.Boolean},System.String,System.Int32,System.Threading.CancellationToken)
  id: WaitForPendingAsync(System.Threading.Tasks.Task,System.Func{System.Boolean},System.String,System.Int32,System.Threading.CancellationToken)
  isExtensionMethod: true
  parent: Kevlar.Testing.ShieldExecutionExtensions
  langs:
  - csharp
  - vb
  name: WaitForPendingAsync(Task, Func<bool>, string, int, CancellationToken)
  nameWithType: ShieldExecutionExtensions.WaitForPendingAsync(Task, Func<bool>, string, int, CancellationToken)
  fullName: Kevlar.Testing.ShieldExecutionExtensions.WaitForPendingAsync(System.Threading.Tasks.Task, System.Func<bool>, string, int, System.Threading.CancellationToken)
  type: Method
  assemblies:
  - Kevlar.Testing
  namespace: Kevlar.Testing
  summary: Waits until caller-observable work has started while verifying that the execution remains pending.
  example: []
  syntax:
    content: public static ValueTask WaitForPendingAsync(this Task execution, Func<bool> workStarted, string workDescription, int maxYields = 100, CancellationToken cancellationToken = default)
    parameters:
    - id: execution
      type: System.Threading.Tasks.Task
      description: The shield execution expected to remain incomplete.
    - id: workStarted
      type: System.Func{System.Boolean}
      description: >-
        A predicate over caller-owned test state that becomes <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> when the expected

        work has started.
    - id: workDescription
      type: System.String
      description: A description included in bounded-failure diagnostics.
    - id: maxYields
      type: System.Int32
      description: The maximum number of scheduler yields used to observe the work.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: Cancels the bounded wait.
    return:
      type: System.Threading.Tasks.ValueTask
    content.vb: Public Shared Function WaitForPendingAsync(execution As Task, workStarted As Func(Of Boolean), workDescription As String, maxYields As Integer = 100, cancellationToken As CancellationToken = Nothing) As ValueTask
  overload: Kevlar.Testing.ShieldExecutionExtensions.WaitForPendingAsync*
  exceptions:
  - type: Kevlar.Testing.ShieldAssertionException
    commentId: T:Kevlar.Testing.ShieldAssertionException
    description: The execution completes before the work is observed, or the work is not observed within the bound.
