  name: Standard(StandardHttpShieldOptions)
  nameWithType: HttpShield.Standard(StandardHttpShieldOptions)
  fullName: Kevlar.Extensions.Http.HttpShield.Standard(Kevlar.Extensions.Http.StandardHttpShieldOptions)
  type: Method
  assemblies:
  - Kevlar.Extensions.Http
  namespace: Kevlar.Extensions.Http
  summary: Builds the standard HTTP pipeline from <code class="paramref">options</code>.
