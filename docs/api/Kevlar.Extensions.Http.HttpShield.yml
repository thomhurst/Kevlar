- uid: Kevlar.Extensions.Http.HttpShield.RetryAfter(System.TimeSpan)
  commentId: M:Kevlar.Extensions.Http.HttpShield.RetryAfter(System.TimeSpan)
  id: RetryAfter(System.TimeSpan)
  parent: Kevlar.Extensions.Http.HttpShield
  langs:
  - csharp
  - vb
  name: RetryAfter(TimeSpan)
  nameWithType: HttpShield.RetryAfter(TimeSpan)
  fullName: Kevlar.Extensions.Http.HttpShield.RetryAfter(System.TimeSpan)
  type: Method
  assemblies:
  - Kevlar.Extensions.Http
  namespace: Kevlar.Extensions.Http
  summary: >-
    Creates a <xref href="Kevlar.RetryOptions%601.DelayGenerator" data-throw-if-not-resolved="false"></xref> that honours

    <code>Retry-After</code> while capping the server suggestion at <code class="paramref">maxDelay</code>.

    The computed backoff is never shortened.
  example: []
  syntax:
    content: public static Func<RetryEvent<HttpResponseMessage>, TimeSpan?> RetryAfter(TimeSpan maxDelay)
    parameters:
    - id: maxDelay
      type: System.TimeSpan
    return:
      type: System.Func{Kevlar.RetryEvent{System.Net.Http.HttpResponseMessage},System.Nullable{System.TimeSpan}}
    content.vb: Public Shared Function RetryAfter(maxDelay As TimeSpan) As Func(Of RetryEvent(Of HttpResponseMessage), TimeSpan?)
  overload: Kevlar.Extensions.Http.HttpShield.RetryAfter*
  exceptions:
  - type: System.ArgumentOutOfRangeException
    commentId: T:System.ArgumentOutOfRangeException
    description: <code class="paramref">maxDelay</code> is negative.
