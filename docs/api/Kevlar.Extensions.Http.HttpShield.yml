      type: Kevlar.RetryEvent{System.Net.Http.HttpResponseMessage}
    return:
      type: System.Nullable{System.TimeSpan}
    content.vb: Public Shared Function RetryAfter(retry As RetryEvent(Of HttpResponseMessage)) As TimeSpan?
  overload: Kevlar.Extensions.Http.HttpShield.RetryAfter*
