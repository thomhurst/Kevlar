- uid: Kevlar.Extensions.Http.HttpShield.WhenTransient
  commentId: M:Kevlar.Extensions.Http.HttpShield.WhenTransient
  id: WhenTransient
  parent: Kevlar.Extensions.Http.HttpShield
  langs:
  - csharp
  - vb
  name: WhenTransient()
  nameWithType: HttpShield.WhenTransient()
  fullName: Kevlar.Extensions.Http.HttpShield.WhenTransient()
  type: Method
  assemblies:
  - Kevlar.Extensions.Http
  namespace: Kevlar.Extensions.Http
  summary: >-
    Starts a shield that handles the usual transient HTTP failures:

    <xref href="System.Net.Http.HttpRequestException" data-throw-if-not-resolved="false"></xref>, <xref href="System.Net.Http.HttpClient.Timeout" data-throw-if-not-resolved="false"></xref> cancellations,

    Kevlar attempt timeouts, 5xx, 408 and 429.

    Chain your strategies onto the returned builder.
  example: []
  syntax:
    content: public static ShieldBuilder<HttpResponseMessage> WhenTransient()
    return:
      type: Kevlar.ShieldBuilder{System.Net.Http.HttpResponseMessage}
    content.vb: Public Shared Function WhenTransient() As ShieldBuilder(Of HttpResponseMessage)
  overload: Kevlar.Extensions.Http.HttpShield.WhenTransient*
- uid: Kevlar.Extensions.Http.HttpShield.Standard
  commentId: M:Kevlar.Extensions.Http.HttpShield.Standard
  id: Standard
  parent: Kevlar.Extensions.Http.HttpShield
  langs:
  - csharp
  - vb
  name: Standard()
  nameWithType: HttpShield.Standard()
  fullName: Kevlar.Extensions.Http.HttpShield.Standard()
  type: Method
  assemblies:
  - Kevlar.Extensions.Http
  namespace: Kevlar.Extensions.Http
  summary: >-
    A production-ready pipeline, outermost first: 30s total timeout → 3 retries with

    exponential jittered backoff honouring <code>Retry-After</code> headers (retried responses are

    disposed) → circuit breaker (50% failure ratio over 30s, minimum 10 calls, 15s break) →

    10s per-attempt timeout.
  example: []
  syntax:
    content: public static Shield<HttpResponseMessage> Standard()
    return:
      type: Kevlar.Shield{System.Net.Http.HttpResponseMessage}
    content.vb: Public Shared Function Standard() As Shield(Of HttpResponseMessage)
  overload: Kevlar.Extensions.Http.HttpShield.Standard*
