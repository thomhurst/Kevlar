  name: ShieldBuilder<TResult>
  nameWithType: ShieldBuilder<TResult>
  fullName: Kevlar.ShieldBuilder<TResult>
  type: Class
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    An immutable exception and result handling clause under construction for a

    <xref href="Kevlar.Shield%601" data-throw-if-not-resolved="false"></xref> chain. Obtained via the <code>When</code>/<code>WhenResult</code> methods on

    <xref href="Kevlar.Shield%601" data-throw-if-not-resolved="false"></xref> and finished by adding a strategy. The clause becomes the shield's

    ambient handling for the strategy added here and reactive strategies chained afterwards.
  remarks: >-
    <p>

    Start a clause with <code>When…</code> on a shield, then continue it with <code>Or…</code> on this builder:

    <code>Shield.For&lt;T&gt;().When&lt;A&gt;().OrResult(r =&gt; …).Retry(3)</code>.

    </p>

    <p>

    The builder is immutable. Each <code>Or…</code> returns a <em>new</em> builder holding the terms

    accumulated so far plus the one just added, and leaves the builder it was called on untouched.

    A builder held in a variable can therefore be branched into two chains safely: each branch gets

    only its own terms. The corollary is that code must use the builder each <code>Or…</code>

    <em>returns</em> — calling <code>Or…</code> and discarding the result adds nothing to anything.

    Adding a strategy freezes the clause of that builder, so a shield already built is never

    changed by further chaining either.

    </p>

    <p>

    One strategy can opt out of the ambient clause: setting <code>HandlesException</code> or

    <code>HandlesResult</code> on its options (<xref href="Kevlar.RetryOptions%601" data-throw-if-not-resolved="false"></xref>,

    <xref href="Kevlar.CircuitBreakerOptions%601" data-throw-if-not-resolved="false"></xref>, <xref href="Kevlar.HedgeOptions%601" data-throw-if-not-resolved="false"></xref>,

    <xref href="Kevlar.FallbackOptions%601" data-throw-if-not-resolved="false"></xref>) makes that strategy ignore the clause and handle only

    what its own predicates select. Every other strategy in the chain keeps using the ambient clause.

    </p>
