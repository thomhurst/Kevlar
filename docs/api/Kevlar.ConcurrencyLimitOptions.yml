items:
- uid: Kevlar.ConcurrencyLimitOptions
  commentId: T:Kevlar.ConcurrencyLimitOptions
  id: ConcurrencyLimitOptions
  parent: Kevlar
  children:
  - Kevlar.ConcurrencyLimitOptions.#ctor
