  - Kevlar.ConcurrencyLimitOptions.MaxQueue
  - Kevlar.ConcurrencyLimitOptions.OnRejected
  - Kevlar.ConcurrencyLimitOptions.OnRejectedAsync
  langs:
  - csharp
  - vb
  name: ConcurrencyLimitOptions
  nameWithType: ConcurrencyLimitOptions
  fullName: Kevlar.ConcurrencyLimitOptions
  type: Class
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Configuration for a concurrency limit (concurrency limiter) strategy: at most

    <xref href="Kevlar.ConcurrencyLimitOptions.MaxConcurrency" data-throw-if-not-resolved="false"></xref> executions run at once, with up to <xref href="Kevlar.ConcurrencyLimitOptions.MaxQueue" data-throw-if-not-resolved="false"></xref>

    more waiting; anything beyond that is rejected immediately.
  remarks: >-
    When an execution is rejected, rejection metrics are recorded, <xref href="Kevlar.ConcurrencyLimitOptions.OnRejected" data-throw-if-not-resolved="false"></xref> runs,

    and then <xref href="Kevlar.ConcurrencyLimitOptions.OnRejectedAsync" data-throw-if-not-resolved="false"></xref> runs and is awaited. A callback failure replaces the

    <xref href="Kevlar.ConcurrencyLimitExceededException" data-throw-if-not-resolved="false"></xref> that would otherwise be returned.
  example: []
  syntax:
    content: public sealed class ConcurrencyLimitOptions
    content.vb: Public NotInheritable Class ConcurrencyLimitOptions
