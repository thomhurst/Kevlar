- uid: Kevlar.CircuitBreakerMonitor.Isolate
  commentId: M:Kevlar.CircuitBreakerMonitor.Isolate
  id: Isolate
  parent: Kevlar.CircuitBreakerMonitor
  langs:
  - csharp
  - vb
  name: Isolate()
  nameWithType: CircuitBreakerMonitor.Isolate()
  fullName: Kevlar.CircuitBreakerMonitor.Isolate()
  type: Method
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Forces every bound circuit open. Executions are rejected until <xref href="Kevlar.CircuitBreakerMonitor.Reset" data-throw-if-not-resolved="false"></xref> is called.

    A non-reentrant caller blocks until transition observers complete; use

    <xref href="Kevlar.CircuitBreakerMonitor.IsolateAsync" data-throw-if-not-resolved="false"></xref> when an <xref href="Kevlar.CircuitBreakerOptions.OnStateChanged" data-throw-if-not-resolved="false"></xref>

    callback may yield. A call made from a transition observer queues its transition and returns

    before that queued transition reaches observers.
  example: []
  syntax:
    content: public void Isolate()
    content.vb: Public Sub Isolate()
  overload: Kevlar.CircuitBreakerMonitor.Isolate*
- uid: Kevlar.CircuitBreakerMonitor.IsolateAsync
  commentId: M:Kevlar.CircuitBreakerMonitor.IsolateAsync
  id: IsolateAsync
  parent: Kevlar.CircuitBreakerMonitor
  langs:
  - csharp
  - vb
  name: IsolateAsync()
  nameWithType: CircuitBreakerMonitor.IsolateAsync()
  fullName: Kevlar.CircuitBreakerMonitor.IsolateAsync()
  type: Method
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Forces every bound circuit open and asynchronously waits for configured transition observers.

    A reentrant call from a transition callback queues its transition behind the active

    publication and returns before that queued transition reaches observers; do not use the

    returned task to order reentrant transition work.

    Executions are rejected until <xref href="Kevlar.CircuitBreakerMonitor.ResetAsync" data-throw-if-not-resolved="false"></xref> is called.
  example: []
  syntax:
    content: public ValueTask IsolateAsync()
    return:
      type: System.Threading.Tasks.ValueTask
    content.vb: Public Function IsolateAsync() As ValueTask
  overload: Kevlar.CircuitBreakerMonitor.IsolateAsync*
- uid: Kevlar.CircuitBreakerMonitor.Reset
  commentId: M:Kevlar.CircuitBreakerMonitor.Reset
  id: Reset
  parent: Kevlar.CircuitBreakerMonitor
  langs:
  - csharp
  - vb
  name: Reset()
  nameWithType: CircuitBreakerMonitor.Reset()
  fullName: Kevlar.CircuitBreakerMonitor.Reset()
  type: Method
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Closes every bound circuit and clears all failure metrics. A non-reentrant caller blocks

    until transition observers complete; use <xref href="Kevlar.CircuitBreakerMonitor.ResetAsync" data-throw-if-not-resolved="false"></xref> when an

    <xref href="Kevlar.CircuitBreakerOptions.OnStateChanged" data-throw-if-not-resolved="false"></xref> callback may yield. A call made from a

    transition observer queues its transition and returns before that queued transition reaches

    observers.
  example: []
  syntax:
    content: public void Reset()
    content.vb: Public Sub Reset()
  overload: Kevlar.CircuitBreakerMonitor.Reset*
- uid: Kevlar.CircuitBreakerMonitor.ResetAsync
  commentId: M:Kevlar.CircuitBreakerMonitor.ResetAsync
  id: ResetAsync
  parent: Kevlar.CircuitBreakerMonitor
  langs:
  - csharp
  - vb
  name: ResetAsync()
  nameWithType: CircuitBreakerMonitor.ResetAsync()
  fullName: Kevlar.CircuitBreakerMonitor.ResetAsync()
  type: Method
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Closes every bound circuit, clears all failure metrics, and asynchronously waits for configured

    transition observers. A reentrant call from a transition callback queues its transition

    behind the active publication and returns before that queued transition reaches observers;

    do not use the returned task to order reentrant transition work.
  example: []
  syntax:
    content: public ValueTask ResetAsync()
    return:
      type: System.Threading.Tasks.ValueTask
    content.vb: Public Function ResetAsync() As ValueTask
  overload: Kevlar.CircuitBreakerMonitor.ResetAsync*
