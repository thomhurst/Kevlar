  namespace: Kevlar.Extensions.DependencyInjection
  summary: Provides the current immutable snapshot of a named result-aware shield.
  remarks: >-
    Read <xref href="Kevlar.Extensions.DependencyInjection.IShieldProvider%601.Current" data-throw-if-not-resolved="false"></xref> once for each operation, then execute that snapshot. The read is

    atomic and allocation-free. Providers registered by <code>AddReloadingShield&lt;TResult&gt;</code>

    may publish a replacement; ordinary shield providers always return their original snapshot.
