- uid: Kevlar.CircuitBreakerOptions`1.OnStateChanged
  commentId: P:Kevlar.CircuitBreakerOptions`1.OnStateChanged
  id: OnStateChanged
  parent: Kevlar.CircuitBreakerOptions`1
  langs:
  - csharp
  - vb
  name: OnStateChanged
  nameWithType: CircuitBreakerOptions<TResult>.OnStateChanged
  fullName: Kevlar.CircuitBreakerOptions<TResult>.OnStateChanged
  type: Property
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Invoked and awaited on every state transition, before

    <xref href="Kevlar.CircuitBreakerMonitor.StateChanged" data-throw-if-not-resolved="false"></xref>. Transitions are delivered serially

    outside the circuit lock, so a slow handler delays later transition publishers. Return

    <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/default">default</a> from a synchronous callback. The event context is valid only

    until the returned task completes.
  example: []
  syntax:
    content: public Func<CircuitBreakerStateChangedEvent, ValueTask>? OnStateChanged { get; set; }
    parameters: []
    return:
      type: System.Func{Kevlar.CircuitBreakerStateChangedEvent,System.Threading.Tasks.ValueTask}
    content.vb: Public Property OnStateChanged As Func(Of CircuitBreakerStateChangedEvent, ValueTask)
  overload: Kevlar.CircuitBreakerOptions`1.OnStateChanged*
  nameWithType.vb: CircuitBreakerOptions(Of TResult).OnStateChanged
  fullName.vb: Kevlar.CircuitBreakerOptions(Of TResult).OnStateChanged
