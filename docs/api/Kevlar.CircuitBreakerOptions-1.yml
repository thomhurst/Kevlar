  summary: >-
    Trips the circuit when the ratio of handled failures within <xref href="Kevlar.CircuitBreakerOptions.SamplingWindow" data-throw-if-not-resolved="false"></xref>

    reaches this value (0 to 1), provided at least <xref href="Kevlar.CircuitBreakerOptions.MinimumThroughput" data-throw-if-not-resolved="false"></xref> executions

    were observed in the window.
