  fullName: Kevlar.Testing.FakeTimeProviderExtensions.AdvanceUntilAsync(Microsoft.Extensions.Time.Testing.FakeTimeProvider, System.TimeSpan, System.Func<bool>, string, int, int, System.Threading.CancellationToken)
  type: Method
  assemblies:
  - Kevlar.Testing
  namespace: Kevlar.Testing
  summary: Advances fake time in fixed steps until a caller-observable condition is satisfied.
  example: []
  syntax:
    content: public static ValueTask AdvanceUntilAsync(this FakeTimeProvider timeProvider, TimeSpan step, Func<bool> condition, string conditionDescription, int maxAdvances = 100, int maxYieldsPerAdvance = 100, CancellationToken cancellationToken = default)
    parameters:
    - id: timeProvider
      type: Microsoft.Extensions.Time.Testing.FakeTimeProvider
      description: The fake clock used by the shield.
    - id: step
      type: System.TimeSpan
      description: The positive amount advanced in each step.
    - id: condition
      type: System.Func{System.Boolean}
      description: A predicate over caller-owned test state.
    - id: conditionDescription
      type: System.String
      description: A description included in bounded-failure diagnostics.
    - id: maxAdvances
      type: System.Int32
      description: The maximum number of time advances.
    - id: maxYieldsPerAdvance
      type: System.Int32
      description: The maximum scheduler yields allowed for continuations after each advance.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: Cancels the bounded advancement.
    return:
      type: System.Threading.Tasks.ValueTask
    content.vb: Public Shared Function AdvanceUntilAsync(timeProvider As FakeTimeProvider, [step] As TimeSpan, condition As Func(Of Boolean), conditionDescription As String, maxAdvances As Integer = 100, maxYieldsPerAdvance As Integer = 100, cancellationToken As CancellationToken = Nothing) As ValueTask
  overload: Kevlar.Testing.FakeTimeProviderExtensions.AdvanceUntilAsync*
  exceptions:
  - type: Kevlar.Testing.ShieldAssertionException
    commentId: T:Kevlar.Testing.ShieldAssertionException
    description: The condition is not met within the configured bounds.
