- uid: Kevlar.ShieldExtensions.Retry(Kevlar.Shield,System.Int32)
  commentId: M:Kevlar.ShieldExtensions.Retry(Kevlar.Shield,System.Int32)
  id: Retry(Kevlar.Shield,System.Int32)
  isExtensionMethod: true
  parent: Kevlar.ShieldExtensions
  langs:
  - csharp
  - vb
  name: Retry(Shield, int)
  nameWithType: ShieldExtensions.Retry(Shield, int)
  fullName: Kevlar.ShieldExtensions.Retry(Kevlar.Shield, int)
  type: Method
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: Appends a retry of handled exceptions, up to <code class="paramref">maxRetries</code> times, with the default exponential jittered backoff.
  example: []
  syntax:
    content: public static Shield Retry(this Shield shield, int maxRetries = 3)
    parameters:
    - id: shield
      type: Kevlar.Shield
      description: The shield to append the retry to.
    - id: maxRetries
      type: System.Int32
      description: >-
        The number of <em>retries</em>, not the number of attempts: <code>Retry(3)</code> makes up to 4

        total attempts — the initial call plus 3 retries.
    return:
      type: Kevlar.Shield
    content.vb: Public Shared Function Retry(shield As Shield, maxRetries As Integer = 3) As Shield
  overload: Kevlar.ShieldExtensions.Retry*
  nameWithType.vb: ShieldExtensions.Retry(Shield, Integer)
  fullName.vb: Kevlar.ShieldExtensions.Retry(Kevlar.Shield, Integer)
