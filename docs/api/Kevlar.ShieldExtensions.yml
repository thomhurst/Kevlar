- uid: Kevlar.ShieldExtensions.Hedge(Kevlar.Shield,System.Int32,System.TimeSpan)
  commentId: M:Kevlar.ShieldExtensions.Hedge(Kevlar.Shield,System.Int32,System.TimeSpan)
  id: Hedge(Kevlar.Shield,System.Int32,System.TimeSpan)
  isExtensionMethod: true
  parent: Kevlar.ShieldExtensions
  langs:
  - csharp
  - vb
  name: Hedge(Shield, int, TimeSpan)
  nameWithType: ShieldExtensions.Hedge(Shield, int, TimeSpan)
  fullName: Kevlar.ShieldExtensions.Hedge(Kevlar.Shield, int, System.TimeSpan)
  type: Method
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: 'Appends hedging: up to <code class="paramref">maxHedgedAttempts</code> additional attempts staggered by <code class="paramref">delay</code>.'
  remarks: >-
    Hedging on an untyped <xref href="Kevlar.Shield" data-throw-if-not-resolved="false"></xref> runs the execution delegate more than once,

    concurrently, and only its exceptions can select a winner. The delegate must therefore be

    idempotent: duplicate writes, charges, or sends are otherwise observable side effects of a

    hedge that later loses. Prefer <code>Shield.For&lt;T&gt;()</code>, where result clauses decide which

    attempt is acceptable, or confirm the action is safe to repeat.
  example: []
  syntax:
    content: public static Shield Hedge(this Shield shield, int maxHedgedAttempts, TimeSpan delay)
    parameters:
