- uid: Kevlar.Extensions.DependencyInjection.KevlarServiceCollectionExtensions.AddReloadingShield(Microsoft.Extensions.DependencyInjection.IServiceCollection,System.String,Microsoft.Extensions.Configuration.IConfiguration,System.Action{System.Exception})
  commentId: M:Kevlar.Extensions.DependencyInjection.KevlarServiceCollectionExtensions.AddReloadingShield(Microsoft.Extensions.DependencyInjection.IServiceCollection,System.String,Microsoft.Extensions.Configuration.IConfiguration,System.Action{System.Exception})
  id: AddReloadingShield(Microsoft.Extensions.DependencyInjection.IServiceCollection,System.String,Microsoft.Extensions.Configuration.IConfiguration,System.Action{System.Exception})
  isExtensionMethod: true
  parent: Kevlar.Extensions.DependencyInjection.KevlarServiceCollectionExtensions
  langs:
  - csharp
  - vb
  name: AddReloadingShield(IServiceCollection, string, IConfiguration, Action<Exception>?)
  nameWithType: KevlarServiceCollectionExtensions.AddReloadingShield(IServiceCollection, string, IConfiguration, Action<Exception>?)
  fullName: Kevlar.Extensions.DependencyInjection.KevlarServiceCollectionExtensions.AddReloadingShield(Microsoft.Extensions.DependencyInjection.IServiceCollection, string, Microsoft.Extensions.Configuration.IConfiguration, System.Action<System.Exception>?)
  type: Method
  assemblies:
  - Kevlar.Extensions.DependencyInjection
  namespace: Kevlar.Extensions.DependencyInjection
  summary: >-
    Registers a named, reload-aware shield bound from <code class="paramref">configuration</code>.

    A complete replacement is built on each change and atomically published through

    <xref href="Kevlar.Extensions.DependencyInjection.IShieldProvider.Current" data-throw-if-not-resolved="false"></xref>. Invalid replacements retain the last known-good

    snapshot and are reported to <code class="paramref">onReloadFailure</code> when supplied.
  remarks: >-
    Changes are debounced for 250 milliseconds by default. Each successful replacement has

    fresh circuit-breaker, rate-limiter, and concurrency-limiter state. Resolve the keyed

    <xref href="Kevlar.Extensions.DependencyInjection.IShieldProvider" data-throw-if-not-resolved="false"></xref> to observe future replacements, or call

    <xref href="Kevlar.Extensions.DependencyInjection.IKevlarRegistry.GetShield(System.String)" data-throw-if-not-resolved="false"></xref> once per operation. Reloading names do not

    register a keyed <xref href="Kevlar.Shield" data-throw-if-not-resolved="false"></xref>, preventing consumers from retaining a stale snapshot.

    Exceptions thrown by <code class="paramref">onReloadFailure</code> are suppressed so future reloads

    remain active.
  example: []
  syntax:
    content: public static IServiceCollection AddReloadingShield(this IServiceCollection services, string name, IConfiguration configuration, Action<Exception>? onReloadFailure = null)
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
    - id: name
      type: System.String
    - id: configuration
      type: Microsoft.Extensions.Configuration.IConfiguration
    - id: onReloadFailure
      type: System.Action{System.Exception}
    return:
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
    content.vb: Public Shared Function AddReloadingShield(services As IServiceCollection, name As String, configuration As IConfiguration, onReloadFailure As Action(Of Exception) = Nothing) As IServiceCollection
  overload: Kevlar.Extensions.DependencyInjection.KevlarServiceCollectionExtensions.AddReloadingShield*
  nameWithType.vb: KevlarServiceCollectionExtensions.AddReloadingShield(IServiceCollection, String, IConfiguration, Action(Of Exception))
  fullName.vb: Kevlar.Extensions.DependencyInjection.KevlarServiceCollectionExtensions.AddReloadingShield(Microsoft.Extensions.DependencyInjection.IServiceCollection, String, Microsoft.Extensions.Configuration.IConfiguration, System.Action(Of System.Exception))
  name.vb: AddReloadingShield(IServiceCollection, String, IConfiguration, Action(Of Exception))
