  - Kevlar.Extensions.DependencyInjection
  namespace: Kevlar.Extensions.DependencyInjection
  summary: >-
    Registers a named, reload-aware result-aware shield bound from

    <code class="paramref">configuration</code>. Invalid replacements retain the last known-good

    snapshot and are reported to <code class="paramref">onReloadFailure</code> when supplied.
  remarks: >-
    Changes are debounced for 250 milliseconds by default. Each successful replacement has

    fresh strategy state. Resolve the keyed

    <xref href="Kevlar.Extensions.DependencyInjection.IShieldProvider%601" data-throw-if-not-resolved="false"></xref> to observe future replacements, or call

    <xref href="Kevlar.Extensions.DependencyInjection.IKevlarRegistry.GetShield%60%601(System.String)" data-throw-if-not-resolved="false"></xref> once per operation. Reloading names

    do not register a keyed <xref href="Kevlar.Shield%601" data-throw-if-not-resolved="false"></xref>, preventing stale injection.

    Exceptions thrown by <code class="paramref">onReloadFailure</code> are suppressed.
  example: []
  syntax:
    content: public static IServiceCollection AddReloadingShield<TResult>(this IServiceCollection services, string name, IConfiguration configuration, Action<Exception>? onReloadFailure = null)
