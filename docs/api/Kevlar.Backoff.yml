- uid: Kevlar.Backoff.Exponential(System.TimeSpan,System.Double,System.Nullable{System.TimeSpan},Kevlar.Jitter)
  commentId: M:Kevlar.Backoff.Exponential(System.TimeSpan,System.Double,System.Nullable{System.TimeSpan},Kevlar.Jitter)
  id: Exponential(System.TimeSpan,System.Double,System.Nullable{System.TimeSpan},Kevlar.Jitter)
  parent: Kevlar.Backoff
  langs:
  - csharp
  - vb
  name: Exponential(TimeSpan, double, TimeSpan?, Jitter)
  nameWithType: Backoff.Exponential(TimeSpan, double, TimeSpan?, Jitter)
  fullName: Kevlar.Backoff.Exponential(System.TimeSpan, double, System.TimeSpan?, Kevlar.Jitter)
  type: Method
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Exponentially increasing delay: <code class="paramref">initialDelay</code>, then multiplied by

    <code class="paramref">factor</code> after each attempt. The default equal jitter scales each delay

    by a random factor in [0.5, 1.5) to avoid synchronized retry storms. Decorrelated jitter

    instead selects each delay between the initial delay and three times the preceding delay.
  example: []
  syntax:
    content: public static Backoff Exponential(TimeSpan initialDelay, double factor = 2, TimeSpan? maxDelay = null, Jitter jitter = Jitter.Equal)
    parameters:
    - id: initialDelay
      type: System.TimeSpan
    - id: factor
      type: System.Double
    - id: maxDelay
      type: System.Nullable{System.TimeSpan}
    - id: jitter
      type: Kevlar.Jitter
    return:
      type: Kevlar.Backoff
    content.vb: Public Shared Function Exponential(initialDelay As TimeSpan, factor As Double = 2, maxDelay As TimeSpan? = Nothing, jitter As Jitter = Jitter.Equal) As Backoff
  overload: Kevlar.Backoff.Exponential*
  nameWithType.vb: Backoff.Exponential(TimeSpan, Double, TimeSpan?, Jitter)
  fullName.vb: Kevlar.Backoff.Exponential(System.TimeSpan, Double, System.TimeSpan?, Kevlar.Jitter)
  name.vb: Exponential(TimeSpan, Double, TimeSpan?, Jitter)
- uid: Kevlar.Backoff.Custom(System.Func{System.Int32,System.TimeSpan})
  commentId: M:Kevlar.Backoff.Custom(System.Func{System.Int32,System.TimeSpan})
  id: Custom(System.Func{System.Int32,System.TimeSpan})
  parent: Kevlar.Backoff
  langs:
  - csharp
  - vb
  name: Custom(Func<int, TimeSpan>)
  nameWithType: Backoff.Custom(Func<int, TimeSpan>)
  fullName: Kevlar.Backoff.Custom(System.Func<int, System.TimeSpan>)
  type: Method
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: A caller-supplied delay function receiving the 1-based retry attempt number.
  remarks: >-
    The returned delay is clamped rather than trusted: a negative delay becomes

    <xref href="System.TimeSpan.Zero" data-throw-if-not-resolved="false"></xref> and anything above the runtime timer limit

    (<code>uint.MaxValue - 1</code> milliseconds, roughly 49 days) becomes that limit. A retry's own

    <xref href="Kevlar.RetryOptions.MaxDelay" data-throw-if-not-resolved="false"></xref> then caps what is left, so an arithmetic slip in

    <code class="paramref">delayFactory</code> cannot wedge a pipeline on a delay it can never wait out.
  example: []
  syntax:
    content: public static Backoff Custom(Func<int, TimeSpan> delayFactory)
    parameters:
    - id: delayFactory
      type: System.Func{System.Int32,System.TimeSpan}
    return:
      type: Kevlar.Backoff
    content.vb: Public Shared Function Custom(delayFactory As Func(Of Integer, TimeSpan)) As Backoff
  overload: Kevlar.Backoff.Custom*
  nameWithType.vb: Backoff.Custom(Func(Of Integer, TimeSpan))
  fullName.vb: Kevlar.Backoff.Custom(System.Func(Of Integer, System.TimeSpan))
  name.vb: Custom(Func(Of Integer, TimeSpan))
