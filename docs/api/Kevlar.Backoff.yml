  summary: >-
    Returns the delay before the given retry attempt, using the preceding effective delay for

    stateful jitter modes. Pass <xref href="System.TimeSpan.Zero" data-throw-if-not-resolved="false"></xref> for the first decorrelated draw.
  example: []
  syntax:
    content: public virtual TimeSpan GetDelay(int attempt, TimeSpan previousDelay)
    parameters:
    - id: attempt
      type: System.Int32
    - id: previousDelay
      type: System.TimeSpan
    return:
      type: System.TimeSpan
    content.vb: Public Overridable Function GetDelay(attempt As Integer, previousDelay As TimeSpan) As TimeSpan
  overload: Kevlar.Backoff.GetDelay*
