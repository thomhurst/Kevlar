  name: PartitionedShield<TKey, TResult>
  nameWithType: PartitionedShield<TKey, TResult>
  fullName: Kevlar.PartitionedShield<TKey, TResult>
  type: Class
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: Selects and retains an independent result-aware <xref href="Kevlar.Shield%601" data-throw-if-not-resolved="false"></xref> for each partition key.
  remarks: >-
    Retention is bounded by <xref href="Kevlar.PartitionedShieldOptions%602.MaxPartitions" data-throw-if-not-resolved="false"></xref>.

    After the eviction callback and active executions complete, disposable strategies owned by an

    evicted shield are released. Shared strategy instances are disposed after their last partition

    owner. By default the provider owns every strategy returned by its factory; set

    <xref href="Kevlar.PartitionedShieldOptions%602.OwnsStrategies" data-throw-if-not-resolved="false"></xref> to

    <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a> when those instances are also used outside the provider. Do not reuse a

    shield after its partition is evicted. A later lookup creates a fresh partition with fresh

    strategy state. Partition keys are never added to metric tags or shield names automatically.
  example: []
  syntax:
    content: 'public sealed class PartitionedShield<TKey, TResult> : IDisposable, IAsyncDisposable where TKey : notnull'
    typeParameters:
    - id: TKey
    - id: TResult
