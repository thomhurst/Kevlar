- uid: Kevlar.FallbackOptions`1.HandlesException
  commentId: P:Kevlar.FallbackOptions`1.HandlesException
  id: HandlesException
  parent: Kevlar.FallbackOptions`1
  langs:
  - csharp
  - vb
  name: HandlesException
  nameWithType: FallbackOptions<TResult>.HandlesException
  fullName: Kevlar.FallbackOptions<TResult>.HandlesException
  type: Property
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Setting this — or <xref href="Kevlar.FallbackOptions%601.HandlesResult" data-throw-if-not-resolved="false"></xref> — makes this fallback ignore the ambient

    <code>When…</code> handling clause; this predicate then selects the exceptions it handles.
  remarks: >-
    The ambient clause is started with <code>When…</code> on a shield and continued with <code>Or…</code> on

    the builder it returns, and applies to every reactive strategy chained after it. These

    properties replace that clause for this strategy alone; they do not narrow it.
  example: []
  syntax:
    content: public Func<Exception, bool>? HandlesException { get; set; }
    parameters: []
    return:
      type: System.Func{System.Exception,System.Boolean}
    content.vb: Public Property HandlesException As Func(Of Exception, Boolean)
  overload: Kevlar.FallbackOptions`1.HandlesException*
  seealso:
  - linkId: Kevlar.HandlingClause
    commentId: T:Kevlar.HandlingClause
  nameWithType.vb: FallbackOptions(Of TResult).HandlesException
  fullName.vb: Kevlar.FallbackOptions(Of TResult).HandlesException
