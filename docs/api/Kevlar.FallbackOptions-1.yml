  name: FallbackOptions<TResult>
  nameWithType: FallbackOptions<TResult>
  fullName: Kevlar.FallbackOptions<TResult>
  type: Class
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Configures result-typed notifications for a fallback strategy on a

    <xref href="Kevlar.Shield%601" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    After an outcome is selected for recovery, Kevlar records the fallback metric, invokes

    and awaits <xref href="Kevlar.FallbackOptions%601.OnFallback" data-throw-if-not-resolved="false"></xref>, and then runs the recovery

    factory. Notification failures are reported through <xref href="Kevlar.KevlarDiagnostics.OnCallbackError" data-throw-if-not-resolved="false"></xref>

    and do not skip recovery.

    Without an ambient clause or local handling override, fallback handles ordinary exceptions and

    <xref href="Kevlar.ExecutionRejectedException" data-throw-if-not-resolved="false"></xref> instances while letting cancellation and fatal runtime

    exceptions propagate.
  example: []
  syntax:
    content: public sealed class FallbackOptions<TResult>
    typeParameters:
    - id: TResult
    content.vb: Public NotInheritable Class FallbackOptions(Of TResult)
