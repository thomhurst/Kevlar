- uid: Kevlar.HedgeOptions.Delay
  commentId: P:Kevlar.HedgeOptions.Delay
  id: Delay
  parent: Kevlar.HedgeOptions
  langs:
  - csharp
  - vb
  name: Delay
  nameWithType: HedgeOptions.Delay
  fullName: Kevlar.HedgeOptions.Delay
  type: Property
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Time to wait before launching the next attempt while the current ones are still running.

    <xref href="System.TimeSpan.Zero" data-throw-if-not-resolved="false"></xref> launches all attempts at once;

    <xref href="System.Threading.Timeout.InfiniteTimeSpan" data-throw-if-not-resolved="false"></xref> hedges only on failure.

    Default 1 second.
  example: []
  syntax:
    content: public TimeSpan Delay { get; set; }
    parameters: []
    return:
      type: System.TimeSpan
    content.vb: Public Property Delay As TimeSpan
  overload: Kevlar.HedgeOptions.Delay*
- uid: Kevlar.HedgeOptions.DelayGenerator
  commentId: P:Kevlar.HedgeOptions.DelayGenerator
  id: DelayGenerator
  parent: Kevlar.HedgeOptions
  langs:
  - csharp
  - vb
  name: DelayGenerator
  nameWithType: HedgeOptions.DelayGenerator
  fullName: Kevlar.HedgeOptions.DelayGenerator
  type: Property
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Selects the delay before each additional attempt while earlier attempts remain pending.

    The generated value replaces <xref href="Kevlar.HedgeOptions.Delay" data-throw-if-not-resolved="false"></xref> for that attempt. Negative values are

    treated as <xref href="System.TimeSpan.Zero" data-throw-if-not-resolved="false"></xref> and values above the runtime timer limit are clamped.
  example: []
  syntax:
    content: public Func<HedgeDelayEvent, TimeSpan>? DelayGenerator { get; set; }
    parameters: []
    return:
      type: System.Func{Kevlar.HedgeDelayEvent,System.TimeSpan}
    content.vb: Public Property DelayGenerator As Func(Of HedgeDelayEvent, TimeSpan)
  overload: Kevlar.HedgeOptions.DelayGenerator*
