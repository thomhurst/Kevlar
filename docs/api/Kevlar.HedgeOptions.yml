  langs:
  - csharp
  - vb
  name: HedgeOptions
  nameWithType: HedgeOptions
  fullName: Kevlar.HedgeOptions
  type: Class
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Configuration for a hedging strategy: launch up to <xref href="Kevlar.HedgeOptions.MaxAttempts" data-throw-if-not-resolved="false"></xref> concurrent

    attempts, staggered by <xref href="Kevlar.HedgeOptions.Delay" data-throw-if-not-resolved="false"></xref>, and return the first acceptable outcome.

    A handled failure always launches the next attempt immediately.
  remarks: >-
    The executed delegate may be invoked multiple times concurrently — it must be safe to do so.

    Hedging requires asynchronous execution.

    Before an additional attempt starts, callbacks run in this order: <xref href="Kevlar.HedgeOptions.OnHedge" data-throw-if-not-resolved="false"></xref>,

    <xref href="Kevlar.HedgeOptions.OnHedgeAsync" data-throw-if-not-resolved="false"></xref>, then <xref href="Kevlar.HedgeOptions.ActionGenerator" data-throw-if-not-resolved="false"></xref>. Caller cancellation is checked

    before callbacks and again before the generated operation starts.
  example: []
  syntax:
    content: public sealed class HedgeOptions
    content.vb: Public NotInheritable Class HedgeOptions
  inheritance:
  - System.Object
  inheritedMembers:
