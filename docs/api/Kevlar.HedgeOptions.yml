- uid: Kevlar.HedgeOptions.HandlesException
  commentId: P:Kevlar.HedgeOptions.HandlesException
  id: HandlesException
  parent: Kevlar.HedgeOptions
  langs:
  - csharp
  - vb
  name: HandlesException
  nameWithType: HedgeOptions.HandlesException
  fullName: Kevlar.HedgeOptions.HandlesException
  type: Property
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Setting this — or, on <xref href="Kevlar.HedgeOptions%601" data-throw-if-not-resolved="false"></xref>, its <code>HandlesResult</code> — makes

    this hedging strategy ignore the ambient <code>When…</code> handling clause; this predicate then

    selects the exceptions it handles.
  remarks: >-
    The ambient clause is started with <code>When…</code> on a shield and continued with <code>Or…</code> on

    the builder it returns, and applies to every reactive strategy chained after it. These

    properties replace that clause for this strategy alone; they do not narrow it.
  example: []
  syntax:
    content: public Func<Exception, bool>? HandlesException { get; set; }
    parameters: []
    return:
      type: System.Func{System.Exception,System.Boolean}
    content.vb: Public Property HandlesException As Func(Of Exception, Boolean)
  overload: Kevlar.HedgeOptions.HandlesException*
  seealso:
  - linkId: Kevlar.HandlingClause
    commentId: T:Kevlar.HandlingClause
