- uid: Kevlar.Extensions.Grpc.GrpcShield.WhenTransient
  commentId: M:Kevlar.Extensions.Grpc.GrpcShield.WhenTransient
  id: WhenTransient
  parent: Kevlar.Extensions.Grpc.GrpcShield
  langs:
  - csharp
  - vb
  name: WhenTransient()
  nameWithType: GrpcShield.WhenTransient()
  fullName: Kevlar.Extensions.Grpc.GrpcShield.WhenTransient()
  type: Method
  assemblies:
  - Kevlar.Extensions.Grpc
  namespace: Kevlar.Extensions.Grpc
  summary: >-
    Starts a shield that handles only <xref href="Grpc.Core.RpcException" data-throw-if-not-resolved="false"></xref> instances whose status is

    commonly transient. Add retry, circuit-breaker, or hedging strategies explicitly.
  example: []
  syntax:
    content: public static ShieldBuilder WhenTransient()
    return:
      type: Kevlar.ShieldBuilder
    content.vb: Public Shared Function WhenTransient() As ShieldBuilder
