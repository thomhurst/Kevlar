- uid: Kevlar.Extensions.Grpc.GrpcShield.IsTransient(Grpc.Core.StatusCode)
  commentId: M:Kevlar.Extensions.Grpc.GrpcShield.IsTransient(Grpc.Core.StatusCode)
  id: IsTransient(Grpc.Core.StatusCode)
  parent: Kevlar.Extensions.Grpc.GrpcShield
  langs:
  - csharp
  - vb
  name: IsTransient(StatusCode)
  nameWithType: GrpcShield.IsTransient(StatusCode)
  fullName: Kevlar.Extensions.Grpc.GrpcShield.IsTransient(Grpc.Core.StatusCode)
  type: Method
  assemblies:
  - Kevlar.Extensions.Grpc
  namespace: Kevlar.Extensions.Grpc
  summary: >-
    Returns <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> for the commonly transient gRPC status codes

    <xref href="Grpc.Core.StatusCode.Unavailable" data-throw-if-not-resolved="false"></xref>, <xref href="Grpc.Core.StatusCode.DeadlineExceeded" data-throw-if-not-resolved="false"></xref>, and

    <xref href="Grpc.Core.StatusCode.ResourceExhausted" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public static bool IsTransient(StatusCode statusCode)
    parameters:
    - id: statusCode
      type: Grpc.Core.StatusCode
    return:
      type: System.Boolean
    content.vb: Public Shared Function IsTransient(statusCode As StatusCode) As Boolean
  overload: Kevlar.Extensions.Grpc.GrpcShield.IsTransient*
- uid: Kevlar.Extensions.Grpc.GrpcShield.IsTransient(Grpc.Core.RpcException)
  commentId: M:Kevlar.Extensions.Grpc.GrpcShield.IsTransient(Grpc.Core.RpcException)
  id: IsTransient(Grpc.Core.RpcException)
  parent: Kevlar.Extensions.Grpc.GrpcShield
  langs:
  - csharp
  - vb
  name: IsTransient(RpcException?)
  nameWithType: GrpcShield.IsTransient(RpcException?)
  fullName: Kevlar.Extensions.Grpc.GrpcShield.IsTransient(Grpc.Core.RpcException?)
  type: Method
  assemblies:
  - Kevlar.Extensions.Grpc
  namespace: Kevlar.Extensions.Grpc
  summary: >-
    Returns <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> when the exception has a commonly transient status and the

    server did not explicitly suppress retries through <code>grpc-retry-pushback-ms</code>, or

    <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a> when <code class="paramref">exception</code> is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>.
  remarks: A negative or malformed pushback value suppresses retries as required by the gRPC retry protocol.
  example: []
  syntax:
    content: public static bool IsTransient(RpcException? exception)
    parameters:
    - id: exception
      type: Grpc.Core.RpcException
    return:
      type: System.Boolean
    content.vb: Public Shared Function IsTransient(exception As RpcException) As Boolean
  overload: Kevlar.Extensions.Grpc.GrpcShield.IsTransient*
  nameWithType.vb: GrpcShield.IsTransient(RpcException)
  fullName.vb: Kevlar.Extensions.Grpc.GrpcShield.IsTransient(Grpc.Core.RpcException)
  name.vb: IsTransient(RpcException)
- uid: Kevlar.Extensions.Grpc.GrpcShield.WhenTransient
  commentId: M:Kevlar.Extensions.Grpc.GrpcShield.WhenTransient
  id: WhenTransient
  parent: Kevlar.Extensions.Grpc.GrpcShield
  langs:
  - csharp
  - vb
  name: WhenTransient()
  nameWithType: GrpcShield.WhenTransient()
  fullName: Kevlar.Extensions.Grpc.GrpcShield.WhenTransient()
  type: Method
  assemblies:
  - Kevlar.Extensions.Grpc
  namespace: Kevlar.Extensions.Grpc
  summary: >-
    Starts a shield that handles only <xref href="Grpc.Core.RpcException" data-throw-if-not-resolved="false"></xref> instances whose status is

    commonly transient. Add retry, circuit-breaker, or hedging strategies explicitly.
  example: []
  syntax:
    content: public static ShieldBuilder WhenTransient()
    return:
      type: Kevlar.ShieldBuilder
    content.vb: Public Shared Function WhenTransient() As ShieldBuilder
  overload: Kevlar.Extensions.Grpc.GrpcShield.WhenTransient*
- uid: Kevlar.Extensions.Grpc.GrpcShield.RetryAfter(Kevlar.RetryEvent)
  commentId: M:Kevlar.Extensions.Grpc.GrpcShield.RetryAfter(Kevlar.RetryEvent)
  id: RetryAfter(Kevlar.RetryEvent)
  parent: Kevlar.Extensions.Grpc.GrpcShield
  langs:
  - csharp
  - vb
  name: RetryAfter(RetryEvent)
  nameWithType: GrpcShield.RetryAfter(RetryEvent)
  fullName: Kevlar.Extensions.Grpc.GrpcShield.RetryAfter(Kevlar.RetryEvent)
  type: Method
  assemblies:
  - Kevlar.Extensions.Grpc
  namespace: Kevlar.Extensions.Grpc
  summary: >-
    A <xref href="Kevlar.RetryOptions.DelayGenerator" data-throw-if-not-resolved="false"></xref> that uses a valid non-negative

    <code>grpc-retry-pushback-ms</code> trailer as the next retry delay.
  remarks: >-
    Use with <xref href="Kevlar.Extensions.Grpc.GrpcShield.WhenTransient" data-throw-if-not-resolved="false"></xref>, whose predicate suppresses retries for negative or

    malformed pushback values. The retry strategy's <xref href="Kevlar.RetryOptions.MaxDelay" data-throw-if-not-resolved="false"></xref> still

    caps the returned delay; when unset, the selected backoff's maximum applies.
  example: []
  syntax:
    content: public static ValueTask<TimeSpan?> RetryAfter(RetryEvent retry)
    parameters:
    - id: retry
      type: Kevlar.RetryEvent
    return:
      type: System.Threading.Tasks.ValueTask{System.Nullable{System.TimeSpan}}
    content.vb: Public Shared Function RetryAfter(retry As RetryEvent) As ValueTask(Of TimeSpan?)
  overload: Kevlar.Extensions.Grpc.GrpcShield.RetryAfter*
