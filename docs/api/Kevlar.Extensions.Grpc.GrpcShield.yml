  - Kevlar.Extensions.Grpc
  namespace: Kevlar.Extensions.Grpc
  summary: >-
    Returns <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> when the exception has a commonly transient status,

    or <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a> when <code class="paramref">exception</code> is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>.
  example: []
  syntax:
    content: public static bool IsTransient(RpcException? exception)
