  - csharp
  - vb
  name: IsTransient(StatusCode)
  nameWithType: GrpcShield.IsTransient(StatusCode)
  fullName: Kevlar.Extensions.Grpc.GrpcShield.IsTransient(Grpc.Core.StatusCode)
  type: Method
  assemblies:
  - Kevlar.Extensions.Grpc
  namespace: Kevlar.Extensions.Grpc
  summary: >-
    Returns <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> for the commonly transient gRPC status codes

    <xref href="Grpc.Core.StatusCode.Unavailable" data-throw-if-not-resolved="false"></xref>, <xref href="Grpc.Core.StatusCode.DeadlineExceeded" data-throw-if-not-resolved="false"></xref>, and

    <xref href="Grpc.Core.StatusCode.ResourceExhausted" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public static bool IsTransient(StatusCode statusCode)
    parameters:
    - id: statusCode
      type: Grpc.Core.StatusCode
    return:
      type: System.Boolean
    content.vb: Public Shared Function IsTransient(statusCode As StatusCode) As Boolean
  overload: Kevlar.Extensions.Grpc.GrpcShield.IsTransient*
