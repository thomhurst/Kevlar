  name: FallbackOptions
  nameWithType: FallbackOptions
  fullName: Kevlar.FallbackOptions
  type: Class
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: Configures notifications for an untyped fallback strategy.
  remarks: >-
    After a failure is selected for recovery, Kevlar records the fallback metric, invokes

    <xref href="Kevlar.FallbackOptions.OnFallback" data-throw-if-not-resolved="false"></xref>, awaits <xref href="Kevlar.FallbackOptions.OnFallbackAsync" data-throw-if-not-resolved="false"></xref>, and then runs the recovery

    action. A notification failure skips recovery and becomes the execution outcome.
  example: []
  syntax:
    content: public sealed class FallbackOptions
    content.vb: Public NotInheritable Class FallbackOptions
