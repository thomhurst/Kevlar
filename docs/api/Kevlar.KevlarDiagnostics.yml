- uid: Kevlar.KevlarDiagnostics.AddMetricEnricher(Kevlar.KevlarMetricEnricher)
  commentId: M:Kevlar.KevlarDiagnostics.AddMetricEnricher(Kevlar.KevlarMetricEnricher)
  id: AddMetricEnricher(Kevlar.KevlarMetricEnricher)
  parent: Kevlar.KevlarDiagnostics
  langs:
  - csharp
  - vb
  name: AddMetricEnricher(KevlarMetricEnricher)
  nameWithType: KevlarDiagnostics.AddMetricEnricher(KevlarMetricEnricher)
  fullName: Kevlar.KevlarDiagnostics.AddMetricEnricher(Kevlar.KevlarMetricEnricher)
  type: Method
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: Registers an application-defined enricher for every Kevlar metric measurement.
  remarks: >-
    Enrichers run synchronously only when an enabled instrument records or observes a

    measurement. Enricher exceptions are ignored and do not prevent later enrichers from

    running. Keep tag names and values bounded to avoid unbounded metric cardinality.
  example: []
  syntax:
    content: public static IDisposable AddMetricEnricher(KevlarMetricEnricher enricher)
    parameters:
    - id: enricher
      type: Kevlar.KevlarMetricEnricher
      description: The enricher to register.
    return:
      type: System.IDisposable
      description: A subscription that removes the enricher when disposed.
    content.vb: Public Shared Function AddMetricEnricher(enricher As KevlarMetricEnricher) As IDisposable
  overload: Kevlar.KevlarDiagnostics.AddMetricEnricher*
- uid: Kevlar.KevlarDiagnostics.ReportCallbackError(Kevlar.CallbackErrorKind,Kevlar.KevlarContext,System.Exception,System.String)
  commentId: M:Kevlar.KevlarDiagnostics.ReportCallbackError(Kevlar.CallbackErrorKind,Kevlar.KevlarContext,System.Exception,System.String)
  id: ReportCallbackError(Kevlar.CallbackErrorKind,Kevlar.KevlarContext,System.Exception,System.String)
  parent: Kevlar.KevlarDiagnostics
  langs:
  - csharp
  - vb
  name: ReportCallbackError(CallbackErrorKind, KevlarContext, Exception, string)
  nameWithType: KevlarDiagnostics.ReportCallbackError(CallbackErrorKind, KevlarContext, Exception, string)
  fullName: Kevlar.KevlarDiagnostics.ReportCallbackError(Kevlar.CallbackErrorKind, Kevlar.KevlarContext, System.Exception, string)
  type: Method
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Reports a callback or cleanup failure without allowing diagnostics subscribers to affect

    execution. Custom strategies can use this method to follow Kevlar's isolation contract.
  example: []
  syntax:
    content: public static void ReportCallbackError(CallbackErrorKind kind, KevlarContext context, Exception exception, string source)
    parameters:
    - id: kind
      type: Kevlar.CallbackErrorKind
      description: The callback family that failed.
    - id: context
      type: Kevlar.KevlarContext
      description: The active execution context.
    - id: exception
      type: System.Exception
      description: The exception thrown by the callback.
    - id: source
      type: System.String
      description: A stable callback or integration identifier.
    content.vb: Public Shared Sub ReportCallbackError(kind As CallbackErrorKind, context As KevlarContext, exception As Exception, source As String)
