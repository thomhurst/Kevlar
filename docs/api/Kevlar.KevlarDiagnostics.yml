  namespace: Kevlar
  summary: >-
    Names for Kevlar's built-in telemetry. On .NET 8+ targets every shield publishes counters and

    duration metrics; the shipped state gauges require .NET 10 or later. Metrics are published

    through a <code>System.Diagnostics.Metrics.Meter</code> named <xref href="Kevlar.KevlarDiagnostics.MeterName" data-throw-if-not-resolved="false"></xref> with zero

    configuration — subscribe with <code>AddMeter("Kevlar")</code> (OpenTelemetry) or a

    <code>MeterListener</code>. On <code>netstandard2.0</code> the instruments are inert.
  remarks: >-
    The meter version is <code>1.0</code>. Instruments:


    <ul><li><code>kevlar.executions</code> — completed public execution calls, including empty shields and

    pre-cancelled calls; attributes <code>kevlar.shield.name</code>, <code>kevlar.execution.outcome</code> (<code>success</code>/<code>failure</code>)</li><li><code>kevlar.retries</code> — retry attempts; attribute <code>kevlar.shield.name</code></li><li><code>kevlar.timeouts</code> — executions cancelled by a timeout strategy; attribute <code>kevlar.shield.name</code></li><li><code>kevlar.hedges</code> — extra hedged attempts launched; attribute <code>kevlar.shield.name</code></li><li><code>kevlar.fallbacks</code> — outcomes replaced by a fallback; attribute <code>kevlar.shield.name</code></li><li><code>kevlar.rejections</code> — fail-fast rejections; attributes <code>kevlar.shield.name</code>, <code>kevlar.rejection.type</code> (<code>circuit_open</code>/<code>rate_limit</code>/<code>rate_limiter_adapter</code>/<code>concurrency_limit</code>)</li><li><code>kevlar.circuit_breaker.transitions</code> — circuit state changes; attributes <code>kevlar.circuit_breaker.state.from</code>, <code>kevlar.circuit_breaker.state.to</code></li><li><code>kevlar.execution.duration</code> — execution duration histogram in seconds; attributes <code>kevlar.shield.name</code>, <code>kevlar.execution.outcome</code></li><li><code>kevlar.circuit_breaker.state</code> — current state gauge (<code>closed=0</code>, <code>open=1</code>, <code>half_open=2</code>, <code>isolated=3</code>)</li><li><code>kevlar.concurrency_limit.inflight</code>, <code>kevlar.concurrency_limit.queued</code>, and <code>kevlar.concurrency_limit.capacity</code> — concurrency-limit state gauges</li><li><code>kevlar.rate_limit.available</code> and <code>kevlar.rate_limit.queued</code> — rate-limit state gauges</li></ul>


    The <code>kevlar.shield.name</code> attribute is present only for shields named via <code>WithName</code>; an explicitly

    empty name is emitted as an empty tag value. State gauges also carry the bounded

    <code>kevlar.strategy.index</code> attribute so multiple stateful strategies in one pipeline remain distinct.
