  name: IKevlarRegistry
  nameWithType: IKevlarRegistry
  fullName: Kevlar.Extensions.DependencyInjection.IKevlarRegistry
  type: Interface
  assemblies:
  - Kevlar.Extensions.DependencyInjection
  namespace: Kevlar.Extensions.DependencyInjection
  summary: Resolves named shields registered via <code>AddShield</code>.
  remarks: >-
    Each registration factory runs at most once. Ordinary shields and factory exceptions are

    cached. Reload-aware registrations cache their provider; <xref href="Kevlar.Extensions.DependencyInjection.IKevlarRegistry.GetShield(System.String)" data-throw-if-not-resolved="false"></xref>

    returns that provider's current snapshot. Names are case-sensitive; an empty name is valid.
