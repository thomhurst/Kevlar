  langs:
  - csharp
  - vb
  name: IKevlarRegistry
  nameWithType: IKevlarRegistry
  fullName: Kevlar.Extensions.DependencyInjection.IKevlarRegistry
  type: Interface
  assemblies:
  - Kevlar.Extensions.DependencyInjection
  namespace: Kevlar.Extensions.DependencyInjection
  summary: Resolves named shields registered via <code>AddShield</code>.
  remarks: >-
    Each registration factory runs at most once after a successful build; failed factories may be

    retried. For a reload-aware registration, <xref href="Kevlar.Extensions.DependencyInjection.IKevlarRegistry.GetShield(System.String)" data-throw-if-not-resolved="false"></xref> returns one stable

    forwarding shield whose executions and inspections use the latest valid publication. The keyed

    <xref href="Kevlar.Extensions.DependencyInjection.IShieldProvider.Current" data-throw-if-not-resolved="false"></xref> property provides explicit immutable snapshots instead.

    Names are case-sensitive; an empty name is valid. Removing a registration does not dispose

    shields already returned to callers.
  example: []
  syntax:
    content: 'public interface IKevlarRegistry : IDisposable, IAsyncDisposable'
    content.vb: Public Interface IKevlarRegistry Inherits IDisposable, IAsyncDisposable
  inheritedMembers:
  - System.IDisposable.Dispose
  - System.IAsyncDisposable.DisposeAsync
