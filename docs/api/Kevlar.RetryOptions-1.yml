- uid: Kevlar.RetryOptions`1.MaxRetries
  commentId: P:Kevlar.RetryOptions`1.MaxRetries
  id: MaxRetries
  parent: Kevlar.RetryOptions`1
  langs:
  - csharp
  - vb
  name: MaxRetries
  nameWithType: RetryOptions<TResult>.MaxRetries
  fullName: Kevlar.RetryOptions<TResult>.MaxRetries
  type: Property
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    The number of <em>retries</em> made after the initial attempt — not the number of attempts.

    <code>MaxRetries = 3</code> (the default) makes up to 4 total attempts: the initial call plus

    3 retries. Use <xref href="System.Int32.MaxValue" data-throw-if-not-resolved="false"></xref> to retry forever.
  example: []
  syntax:
    content: public int MaxRetries { get; set; }
    parameters: []
    return:
      type: System.Int32
    content.vb: Public Property MaxRetries As Integer
  overload: Kevlar.RetryOptions`1.MaxRetries*
  nameWithType.vb: RetryOptions(Of TResult).MaxRetries
  fullName.vb: Kevlar.RetryOptions(Of TResult).MaxRetries
