  fullName: Kevlar.RetryOptions<TResult>.DelayGenerator
  type: Property
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Overrides the computed delay for a specific retry, with the typed handled outcome.

    Return a non-null value to replace the backoff-computed delay;

    <xref href="Kevlar.RetryOptions%601.MaxDelay" data-throw-if-not-resolved="false"></xref> still caps the returned value.
  example: []
  syntax:
    content: public Func<RetryEvent<TResult>, TimeSpan?>? DelayGenerator { get; set; }
    parameters: []
    return:
      type: System.Func{Kevlar.RetryEvent{{TResult}},System.Nullable{System.TimeSpan}}
    content.vb: Public Property DelayGenerator As Func(Of RetryEvent(Of TResult), TimeSpan?)
  overload: Kevlar.RetryOptions`1.DelayGenerator*
