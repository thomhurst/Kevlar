- uid: Kevlar.RetryOptions`1.DelayGeneratorAsync
  commentId: P:Kevlar.RetryOptions`1.DelayGeneratorAsync
  id: DelayGeneratorAsync
  parent: Kevlar.RetryOptions`1
  langs:
  - csharp
  - vb
  name: DelayGeneratorAsync
  nameWithType: RetryOptions<TResult>.DelayGeneratorAsync
  fullName: Kevlar.RetryOptions<TResult>.DelayGeneratorAsync
  type: Property
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Asynchronously overrides the delay for a specific retry, with the typed handled outcome.

    Receives the delay after the synchronous generator and <xref href="Kevlar.RetryOptions%601.MaxDelay" data-throw-if-not-resolved="false"></xref>

    have been applied. Return a non-null value to replace it; the maximum still applies.
  example: []
  syntax:
    content: public Func<RetryEvent<TResult>, ValueTask<TimeSpan?>>? DelayGeneratorAsync { get; set; }
    parameters: []
    return:
      type: System.Func{Kevlar.RetryEvent{{TResult}},System.Threading.Tasks.ValueTask{System.Nullable{System.TimeSpan}}}
    content.vb: Public Property DelayGeneratorAsync As Func(Of RetryEvent(Of TResult), ValueTask(Of TimeSpan?))
  overload: Kevlar.RetryOptions`1.DelayGeneratorAsync*
  nameWithType.vb: RetryOptions(Of TResult).DelayGeneratorAsync
  fullName.vb: Kevlar.RetryOptions(Of TResult).DelayGeneratorAsync
