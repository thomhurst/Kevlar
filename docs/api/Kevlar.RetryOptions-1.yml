  langs:
  - csharp
  - vb
  name: RetryOptions<TResult>
  nameWithType: RetryOptions<TResult>
  fullName: Kevlar.RetryOptions<TResult>
  type: Class
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Result-typed configuration for a retry strategy on a <xref href="Kevlar.Shield%601" data-throw-if-not-resolved="false"></xref>: the events

    carry a typed <xref href="Kevlar.Outcome%601" data-throw-if-not-resolved="false"></xref> instead of a boxed <xref href="System.Object" data-throw-if-not-resolved="false"></xref> result.
  remarks: >-
    <xref href="Kevlar.RetryOptions%601" data-throw-if-not-resolved="false"></xref> and <xref href="Kevlar.RetryOptions" data-throw-if-not-resolved="false"></xref> are standalone sibling types.

    Their callback properties expose distinct delegate types and preserve the delegates assigned

    to them.

    Before each retry, callbacks run in this order: <xref href="Kevlar.RetryOptions%601.DelayGenerator" data-throw-if-not-resolved="false"></xref>,

    <xref href="Kevlar.RetryOptions%601.DelayGeneratorAsync" data-throw-if-not-resolved="false"></xref>, <xref href="Kevlar.RetryOptions%601.OnRetry" data-throw-if-not-resolved="false"></xref>, then <xref href="Kevlar.RetryOptions%601.OnRetryAsync" data-throw-if-not-resolved="false"></xref>.

    If the caller's cancellation token is cancelled by the time the callbacks complete, the retry

    stops and surfaces caller cancellation.
  example: []
  syntax:
    content: public sealed class RetryOptions<TResult>
    typeParameters:
    - id: TResult
    content.vb: Public NotInheritable Class RetryOptions(Of TResult)
  inheritance:
