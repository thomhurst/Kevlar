  name: ShieldTaskExtensions
  nameWithType: ShieldTaskExtensions
  fullName: Kevlar.ShieldTaskExtensions
  type: Class
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref>-based execution overloads. Most application code returns

    <xref href="System.Threading.Tasks.Task%601" data-throw-if-not-resolved="false"></xref> rather than <xref href="System.Threading.Tasks.ValueTask%601" data-throw-if-not-resolved="false"></xref>; these overloads let such

    delegates flow straight into a shield: <code>shield.ExecuteAsync(ct =&gt; LoadUserAsync(id, ct))</code>.
  remarks: >-
    They are extension methods deliberately: the instance <code>ValueTask</code> overloads always win

    overload resolution when both apply (async lambdas), so these only kick in for delegates that

    genuinely return <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref> — with no ambiguity and no behavior change elsewhere.
  example: []
  syntax:
    content: public static class ShieldTaskExtensions
    content.vb: Public Module ShieldTaskExtensions
