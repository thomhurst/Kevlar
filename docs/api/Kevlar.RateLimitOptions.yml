  name: RateLimitOptions
  nameWithType: RateLimitOptions
  fullName: Kevlar.RateLimitOptions
  type: Class
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Configuration for a token-bucket rate limit strategy: <xref href="Kevlar.RateLimitOptions.Permits" data-throw-if-not-resolved="false"></xref> executions per

    <xref href="Kevlar.RateLimitOptions.Window" data-throw-if-not-resolved="false"></xref>, with bursts up to <xref href="Kevlar.RateLimitOptions.Burst" data-throw-if-not-resolved="false"></xref> and optional queueing.
  remarks: >-
    When an execution is rejected, rejection metrics are recorded, <xref href="Kevlar.RateLimitOptions.OnRejected" data-throw-if-not-resolved="false"></xref> runs,

    and then <xref href="Kevlar.RateLimitOptions.OnRejectedAsync" data-throw-if-not-resolved="false"></xref> runs and is awaited. Callback failures are reported

    through <xref href="Kevlar.KevlarDiagnostics.OnCallbackError" data-throw-if-not-resolved="false"></xref> and do not replace the rejection.
  example: []
  syntax:
    content: public sealed class RateLimitOptions
    content.vb: Public NotInheritable Class RateLimitOptions
