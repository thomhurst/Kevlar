  name: ShieldStreamingClientInterceptor(Shield, Shield)
  nameWithType: ShieldStreamingClientInterceptor.ShieldStreamingClientInterceptor(Shield, Shield)
  fullName: Kevlar.Extensions.Grpc.ShieldStreamingClientInterceptor.ShieldStreamingClientInterceptor(Kevlar.Shield, Kevlar.Shield)
  type: Constructor
  assemblies:
  - Kevlar.Extensions.Grpc
  namespace: Kevlar.Extensions.Grpc
  summary: Creates an interceptor with separate server-stream establishment and per-operation shields.
  remarks: >-
    <code class="paramref">establishmentShield</code> may repeat a server-streaming call before progress.

    <code class="paramref">operationShield</code> protects individual reads and writes, and therefore must

    invoke each continuation at most once. Client-streaming response completion remains governed

    by the call lifetime so waiting for the response cannot occupy an operation concurrency slot.
  example: []
  syntax:
    content: public ShieldStreamingClientInterceptor(Shield establishmentShield, Shield operationShield)
    parameters:
    - id: establishmentShield
      type: Kevlar.Shield
    - id: operationShield
      type: Kevlar.Shield
    content.vb: Public Sub New(establishmentShield As Shield, operationShield As Shield)
