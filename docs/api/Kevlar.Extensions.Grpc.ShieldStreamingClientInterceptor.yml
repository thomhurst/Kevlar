  summary: Intercepts an asynchronous invocation of a streaming remote call.
  example: []
  syntax:
    content: 'public override AsyncServerStreamingCall<TResponse> AsyncServerStreamingCall<TRequest, TResponse>(TRequest request, ClientInterceptorContext<TRequest, TResponse> context, Interceptor.AsyncServerStreamingCallContinuation<TRequest, TResponse> continuation) where TRequest : class where TResponse : class'
    parameters:
    - id: request
      type: '{TRequest}'
      description: The request message of the invocation.
    - id: context
      type: Grpc.Core.Interceptors.ClientInterceptorContext{{TRequest},{TResponse}}
      description: >-
        The <xref href="Grpc.Core.Interceptors.ClientInterceptorContext%602" data-throw-if-not-resolved="false"></xref>

        associated with the current invocation.
    - id: continuation
      type: Grpc.Core.Interceptors.Interceptor.AsyncServerStreamingCallContinuation{{TRequest},{TResponse}}
      description: >-
        The callback that continues the invocation process.

        This can be invoked zero or more times by the interceptor.

        The interceptor can invoke the continuation passing the given

        request value and context arguments, or substitute them as it sees fit.
    typeParameters:
    - id: TRequest
    - id: TResponse
    return:
      type: Grpc.Core.AsyncServerStreamingCall{{TResponse}}
      description: >-
        An instance of <xref href="Grpc.Core.AsyncServerStreamingCall%601" data-throw-if-not-resolved="false"></xref>

        representing an asynchronous server-streaming invocation.

        The interceptor can simply return the return value of the

        continuation delegate passed to it intact, or construct its

        own substitute as it sees fit.
