  name: ShieldStreamingClientInterceptor
  nameWithType: ShieldStreamingClientInterceptor
  fullName: Kevlar.Extensions.Grpc.ShieldStreamingClientInterceptor
  type: Class
  assemblies:
  - Kevlar.Extensions.Grpc
  namespace: Kevlar.Extensions.Grpc
  summary: Applies explicit, replay-safe resilience boundaries to asynchronous streaming calls.
  remarks: >-
    Server-streaming calls may retry only until response headers or the first response item become

    observable. Client-streaming and duplex calls never replay messages, so their per-operation

    shield must invoke its continuation at most once.
  example: []
  syntax:
    content: 'public sealed class ShieldStreamingClientInterceptor : Interceptor'
    content.vb: Public NotInheritable Class ShieldStreamingClientInterceptor Inherits Interceptor
