  name: PartitionedShield<TKey>
  nameWithType: PartitionedShield<TKey>
  fullName: Kevlar.PartitionedShield<TKey>
  type: Class
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: Selects and retains an independent untyped <xref href="Kevlar.Shield" data-throw-if-not-resolved="false"></xref> for each partition key.
  remarks: >-
    Retention is bounded by <xref href="Kevlar.PartitionedShieldOptions%601.MaxPartitions" data-throw-if-not-resolved="false"></xref>. Eviction

    removes only the provider's reference: callers that already hold the old shield, including

    active executions, continue normally. A later lookup creates a fresh partition with fresh

    strategy state. Partition keys are never added to metric tags or shield names automatically.
