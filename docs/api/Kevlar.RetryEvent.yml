- uid: Kevlar.RetryEvent.Result
  commentId: P:Kevlar.RetryEvent.Result
  id: Result
  parent: Kevlar.RetryEvent
  langs:
  - csharp
  - vb
  name: Result
  nameWithType: RetryEvent.Result
  fullName: Kevlar.RetryEvent.Result
  type: Property
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    The handled result from the failed attempt, or <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> when an exception

    occurred.
  remarks: >-
    The untyped event carries the result as <xref href="System.Object" data-throw-if-not-resolved="false"></xref>, so a value-type result is

    boxed on every retry and has to be unboxed — and its type re-asserted — by the callback.

    Configure the retry through <xref href="Kevlar.RetryOptions%601" data-throw-if-not-resolved="false"></xref> on a

    <xref href="Kevlar.Shield%601" data-throw-if-not-resolved="false"></xref> to receive <xref href="Kevlar.RetryEvent%601" data-throw-if-not-resolved="false"></xref> instead: its

    <xref href="Kevlar.RetryEvent%601.Outcome" data-throw-if-not-resolved="false"></xref> is a typed <xref href="Kevlar.Outcome%601" data-throw-if-not-resolved="false"></xref>, with

    no boxing and no cast.
  example: []
  syntax:
    content: public object? Result { get; }
    parameters: []
    return:
      type: System.Object
    content.vb: Public ReadOnly Property Result As Object
  overload: Kevlar.RetryEvent.Result*
