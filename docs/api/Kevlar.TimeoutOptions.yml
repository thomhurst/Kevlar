  - Kevlar.TimeoutOptions.TimeoutGenerator
  langs:
  - csharp
  - vb
  name: TimeoutOptions
  nameWithType: TimeoutOptions
  fullName: Kevlar.TimeoutOptions
  type: Class
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: Configuration for a timeout strategy.
  remarks: >-
    <xref href="Kevlar.TimeoutOptions.TimeoutGenerator" data-throw-if-not-resolved="false"></xref> runs before the timeout timer is armed and overrides

    <xref href="Kevlar.TimeoutOptions.Timeout" data-throw-if-not-resolved="false"></xref> for that execution. When a timeout wins, <xref href="Kevlar.TimeoutOptions.OnTimeout" data-throw-if-not-resolved="false"></xref> runs

    after timer cleanup and restoration of the caller's cancellation token. Hooks that complete

    synchronously add no overhead and remain compatible with synchronous <code>Execute</code>.

    The strategy always awaits the delegate and translates only a direct

    <xref href="System.OperationCanceledException" data-throw-if-not-resolved="false"></xref> into <xref href="Kevlar.TimeoutExceededException" data-throw-if-not-resolved="false"></xref>. A blocking

    synchronous delegate that ignores cancellation cannot be timed out, and a wrapped cancellation

    exception surfaces unchanged.
  example: []
  syntax:
    content: public sealed class TimeoutOptions
    content.vb: Public NotInheritable Class TimeoutOptions
