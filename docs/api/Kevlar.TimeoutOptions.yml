- uid: Kevlar.TimeoutOptions.TimeoutGenerator
  commentId: P:Kevlar.TimeoutOptions.TimeoutGenerator
  id: TimeoutGenerator
  parent: Kevlar.TimeoutOptions
  langs:
  - csharp
  - vb
  name: TimeoutGenerator
  nameWithType: TimeoutOptions.TimeoutGenerator
  fullName: Kevlar.TimeoutOptions.TimeoutGenerator
  type: Property
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Produces the timeout for each execution and is awaited before the timer is armed. The event

    carries the configured <xref href="Kevlar.TimeoutOptions.Timeout" data-throw-if-not-resolved="false"></xref> and execution context. The returned value must

    be positive and no greater than the runtime timer limit. Return <code>new(timeout)</code> from a

    synchronous generator. The event context is valid only until the returned task completes.
  example: []
  syntax:
    content: public Func<TimeoutEvent, ValueTask<TimeSpan>>? TimeoutGenerator { get; set; }
    parameters: []
    return:
      type: System.Func{Kevlar.TimeoutEvent,System.Threading.Tasks.ValueTask{System.TimeSpan}}
    content.vb: Public Property TimeoutGenerator As Func(Of TimeoutEvent, ValueTask(Of TimeSpan))
  overload: Kevlar.TimeoutOptions.TimeoutGenerator*
- uid: Kevlar.TimeoutOptions.OnTimeout
  commentId: P:Kevlar.TimeoutOptions.OnTimeout
  id: OnTimeout
  parent: Kevlar.TimeoutOptions
  langs:
  - csharp
  - vb
  name: OnTimeout
  nameWithType: TimeoutOptions.OnTimeout
  fullName: Kevlar.TimeoutOptions.OnTimeout
  type: Property
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Invoked and awaited when an execution is cancelled because it exceeded the timeout. Return

    <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/default">default</a> from a synchronous callback. The event context is valid only

    until the returned task completes.
  example: []
  syntax:
    content: public Func<TimeoutEvent, ValueTask>? OnTimeout { get; set; }
    parameters: []
    return:
      type: System.Func{Kevlar.TimeoutEvent,System.Threading.Tasks.ValueTask}
    content.vb: Public Property OnTimeout As Func(Of TimeoutEvent, ValueTask)
  overload: Kevlar.TimeoutOptions.OnTimeout*
