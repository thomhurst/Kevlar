  langs:
  - csharp
  - vb
  name: ShieldDefinition
  nameWithType: ShieldDefinition
  fullName: Kevlar.Extensions.DependencyInjection.ShieldDefinition
  type: Class
  assemblies:
  - Kevlar.Extensions.DependencyInjection
  namespace: Kevlar.Extensions.DependencyInjection
  summary: >-
    A declarative shield that can be bound from configuration (appsettings, environment,

    key vault…), so retry counts, timeouts and breaker thresholds are tunable without a redeploy.
  remarks: >-
    <p>

    <xref href="Kevlar.Extensions.DependencyInjection.ShieldDefinition.Build" data-throw-if-not-resolved="false"></xref> chains the sections in one fixed order, outermost first:

    <xref href="Kevlar.Extensions.DependencyInjection.ShieldDefinition.Timeout" data-throw-if-not-resolved="false"></xref> → <xref href="Kevlar.Extensions.DependencyInjection.ShieldDefinition.Retry" data-throw-if-not-resolved="false"></xref> → <xref href="Kevlar.Extensions.DependencyInjection.ShieldDefinition.CircuitBreaker" data-throw-if-not-resolved="false"></xref> →

    <xref href="Kevlar.Extensions.DependencyInjection.ShieldDefinition.RateLimit" data-throw-if-not-resolved="false"></xref> → <xref href="Kevlar.Extensions.DependencyInjection.ShieldDefinition.ConcurrencyLimit" data-throw-if-not-resolved="false"></xref> → <xref href="Kevlar.Extensions.DependencyInjection.ShieldDefinition.AttemptTimeout" data-throw-if-not-resolved="false"></xref>.

    Only the sections present in configuration are added; the rest keep their relative order.

    </p>

    <p>

    The order reads like any fluent chain: <xref href="Kevlar.Extensions.DependencyInjection.ShieldDefinition.Timeout" data-throw-if-not-resolved="false"></xref> is the total budget around

    everything, retries happen inside it, every attempt passes through the breaker and the two

    limiters, and <xref href="Kevlar.Extensions.DependencyInjection.ShieldDefinition.AttemptTimeout" data-throw-if-not-resolved="false"></xref> is the innermost per-attempt budget. Configuration

    cannot reorder the chain — build the shield with the fluent API when a different shape is

    needed.

    </p>
  example: []
  syntax:
    content: public sealed class ShieldDefinition
    content.vb: Public NotInheritable Class ShieldDefinition
