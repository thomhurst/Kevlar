- uid: Kevlar.PartitionedShieldOptions.OnEvicted
  commentId: P:Kevlar.PartitionedShieldOptions.OnEvicted
  id: OnEvicted
  parent: Kevlar.PartitionedShieldOptions
  langs:
  - csharp
  - vb
  name: OnEvicted
  nameWithType: PartitionedShieldOptions.OnEvicted
  fullName: Kevlar.PartitionedShieldOptions.OnEvicted
  type: Property
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Invoked and awaited after a partition is removed from the provider and before an

    automatically evicted partition's slot is reused. A cold lookup reentered from this

    callback may return an unretained shield when the invoking eviction owns all available

    capacity. Return <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/default">default</a> from a synchronous callback.
  example: []
  syntax:
    content: public Func<PartitionEvictionNotification, ValueTask>? OnEvicted { get; set; }
    parameters: []
    return:
      type: System.Func{Kevlar.PartitionEvictionNotification,System.Threading.Tasks.ValueTask}
    content.vb: Public Property OnEvicted As Func(Of PartitionEvictionNotification, ValueTask)
  overload: Kevlar.PartitionedShieldOptions.OnEvicted*
