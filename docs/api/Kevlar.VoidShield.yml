  name: VoidShield
  nameWithType: VoidShield
  fullName: Kevlar.VoidShield
  type: Class
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    An immutable, thread-safe resilience pipeline restricted to void executions because it contains

    a void fallback. Obtained by chaining <code>Fallback(…)</code> from <xref href="Kevlar.Shield" data-throw-if-not-resolved="false"></xref> or

    <xref href="Kevlar.ShieldBuilder" data-throw-if-not-resolved="false"></xref>. Subsequent fluent calls preserve the restriction.
