  - Kevlar.Extensions.RateLimiting
  namespace: Kevlar.Extensions.RateLimiting
  summary: Configuration for a framework or delegate-backed rate-limiter adapter.
  remarks: >-
    Rejections record the standard Kevlar rejection metric, invoke <xref href="Kevlar.Extensions.RateLimiting.RateLimiterAdapterOptions.OnRejected" data-throw-if-not-resolved="false"></xref>, then

    invoke and await <xref href="Kevlar.Extensions.RateLimiting.RateLimiterAdapterOptions.OnRejectedAsync" data-throw-if-not-resolved="false"></xref>. Callback failures are reported through

    <xref href="Kevlar.KevlarDiagnostics.OnCallbackError" data-throw-if-not-resolved="false"></xref> and do not replace the rejection.
