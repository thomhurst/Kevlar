- uid: Kevlar.ShieldResultExtensions
  commentId: T:Kevlar.ShieldResultExtensions
  id: ShieldResultExtensions
  parent: Kevlar
  children:
  - Kevlar.ShieldResultExtensions.OrResultIsNull``1(Kevlar.ShieldBuilder{``0})
