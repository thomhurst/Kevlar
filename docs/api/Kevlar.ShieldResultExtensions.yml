  langs:
  - csharp
  - vb
  name: ShieldResultExtensions
  nameWithType: ShieldResultExtensions
  fullName: Kevlar.ShieldResultExtensions
  type: Class
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Result-handling clauses for <xref href="Kevlar.Shield%601" data-throw-if-not-resolved="false"></xref> chains whose result is a reference

    type. They are extension methods because only an extension method can constrain

    <code>TResult</code>: a method declared on <xref href="Kevlar.Shield%601" data-throw-if-not-resolved="false"></xref> itself inherits whatever

    the shield was built for, so a null clause written there would compile for <code>int</code> too.
  example: []
  syntax:
    content: public static class ShieldResultExtensions
    content.vb: Public Module ShieldResultExtensions
