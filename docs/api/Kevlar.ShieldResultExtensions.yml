- uid: Kevlar.ShieldResultExtensions.WhenResultIsNull``1(Kevlar.Shield{``0})
  commentId: M:Kevlar.ShieldResultExtensions.WhenResultIsNull``1(Kevlar.Shield{`0})
  id: WhenResultIsNull``1(Kevlar.Shield{``0})
  isExtensionMethod: true
  parent: Kevlar.ShieldResultExtensions
  langs:
  - csharp
  - vb
  name: WhenResultIsNull<TResult>(Shield<TResult>)
  nameWithType: ShieldResultExtensions.WhenResultIsNull<TResult>(Shield<TResult>)
  fullName: Kevlar.ShieldResultExtensions.WhenResultIsNull<TResult>(Kevlar.Shield<TResult>)
  type: Method
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Starts a handling clause for <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> results. Use

    <xref href="Kevlar.Shield%601.WithDefaultHandling" data-throw-if-not-resolved="false"></xref> to return to default handling.
  remarks: >-
    Prefer this to <xref href="Kevlar.Shield%601.WhenResultIsDefault" data-throw-if-not-resolved="false"></xref> whenever the result is a

    reference type: both match the same values, but this one cannot be written for a value type

    whose <code>default</code> — <code>0</code>, <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a> — is usually a legitimate result

    rather than a failure.
  example: []
  syntax:
    content: 'public static ShieldBuilder<TResult> WhenResultIsNull<TResult>(this Shield<TResult> shield) where TResult : class?'
    parameters:
    - id: shield
      type: Kevlar.Shield{{TResult}}
    typeParameters:
    - id: TResult
    return:
      type: Kevlar.ShieldBuilder{{TResult}}
    content.vb: Public Shared Function WhenResultIsNull(Of TResult As Class)(shield As Shield(Of TResult)) As ShieldBuilder(Of TResult)
  overload: Kevlar.ShieldResultExtensions.WhenResultIsNull*
  nameWithType.vb: ShieldResultExtensions.WhenResultIsNull(Of TResult)(Shield(Of TResult))
  fullName.vb: Kevlar.ShieldResultExtensions.WhenResultIsNull(Of TResult)(Kevlar.Shield(Of TResult))
  name.vb: WhenResultIsNull(Of TResult)(Shield(Of TResult))
