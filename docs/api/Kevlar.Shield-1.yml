  name: Shield<TResult>
  nameWithType: Shield<TResult>
  fullName: Kevlar.Shield<TResult>
  type: Class
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    An immutable, thread-safe, result-aware resilience pipeline for executions returning

    <code class="typeparamref">TResult</code>. Unlike <xref href="Kevlar.Shield" data-throw-if-not-resolved="false"></xref>, its handling clauses can react to

    result values (<code>WhenResult</code>) as well as exceptions. The first strategy in a chain is the

    outermost.
