    for reference types. Use <xref href="Kevlar.Shield%601.WithDefaultHandling" data-throw-if-not-resolved="false"></xref> to return to default handling.
  remarks: >-
    For a reference type prefer <xref href="Kevlar.ShieldResultExtensions.WhenResultIsNull%60%601(Kevlar.Shield%7b%60%600%7d)" data-throw-if-not-resolved="false"></xref>,

    which says what it matches. This method stays for value types and generic code, where

    <code>default(TResult)</code> — <code>0</code>, <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a> — may or may not be a failure.
