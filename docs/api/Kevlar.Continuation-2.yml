  type: Method
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Runs the remainder of the pipeline. Never throws; failures are returned as outcomes.

    A default, uninitialized continuation returns an <xref href="System.InvalidOperationException" data-throw-if-not-resolved="false"></xref> outcome.
  example: []
