  langs:
  - csharp
  - vb
  name: ShieldBuilder
  nameWithType: ShieldBuilder
  fullName: Kevlar.ShieldBuilder
  type: Class
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    An immutable exception-handling clause under construction for a <xref href="Kevlar.Shield" data-throw-if-not-resolved="false"></xref> chain.

    Obtained via <code>Shield.When&lt;T&gt;()</code> or <code>shield.When&lt;T&gt;()</code>; finished by adding a

    strategy. The clause becomes the shield's ambient handling: it applies to the strategy added

    here and to reactive strategies chained afterwards, until replaced by a new clause.
  remarks: >-
    <p>

    Start a clause with <code>When…</code> on a shield, then continue it with <code>Or…</code> on this builder:

    <code>Shield.When&lt;A&gt;().Or&lt;B&gt;().Retry(3)</code>.

    </p>

    <p>

    The builder is immutable. Each <code>Or…</code> returns a <em>new</em> builder holding the terms

    accumulated so far plus the one just added, and leaves the builder it was called on untouched.

    A builder held in a variable can therefore be branched into two chains safely: each branch gets

    only its own terms. The corollary is that code must use the builder each <code>Or…</code>

    <em>returns</em> — calling <code>Or…</code> and discarding the result adds nothing to anything.

    Adding a strategy freezes the clause of that builder, so a shield already built is never

    changed by further chaining either.

    </p>

    <p>

    One strategy can opt out of the ambient clause: setting <code>HandlesException</code> on its options

    (<xref href="Kevlar.RetryOptions" data-throw-if-not-resolved="false"></xref>, <xref href="Kevlar.CircuitBreakerOptions" data-throw-if-not-resolved="false"></xref>, <xref href="Kevlar.HedgeOptions" data-throw-if-not-resolved="false"></xref>,

    <xref href="Kevlar.FallbackOptions" data-throw-if-not-resolved="false"></xref>) makes that strategy ignore the clause and handle only what its

    own predicate selects. Every other strategy in the chain keeps using the ambient clause.

    </p>
  example: []
  syntax:
    content: public sealed class ShieldBuilder
    content.vb: Public NotInheritable Class ShieldBuilder
