- uid: Kevlar.ShieldBuilder.Hedge(System.Int32,System.TimeSpan)
  commentId: M:Kevlar.ShieldBuilder.Hedge(System.Int32,System.TimeSpan)
  id: Hedge(System.Int32,System.TimeSpan)
  parent: Kevlar.ShieldBuilder
  langs:
  - csharp
  - vb
  name: Hedge(int, TimeSpan)
  nameWithType: ShieldBuilder.Hedge(int, TimeSpan)
  fullName: Kevlar.ShieldBuilder.Hedge(int, System.TimeSpan)
  type: Method
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: Races concurrent attempts; a handled exception launches the next attempt immediately.
  remarks: >-
    Hedging on an untyped <xref href="Kevlar.Shield" data-throw-if-not-resolved="false"></xref> runs the execution delegate more than once,

    concurrently, and only its exceptions can select a winner. The delegate must therefore be

    idempotent: duplicate writes, charges, or sends are otherwise observable side effects of a

    hedge that later loses. Prefer <code>Shield.For&lt;T&gt;()</code>, where result clauses decide which

    attempt is acceptable, or confirm the action is safe to repeat.
  example: []
  syntax:
    content: public Shield Hedge(int maxAttempts, TimeSpan delay)
    parameters:
    - id: maxAttempts
      type: System.Int32
    - id: delay
      type: System.TimeSpan
    return:
      type: Kevlar.Shield
    content.vb: Public Function Hedge(maxAttempts As Integer, delay As TimeSpan) As Shield
  overload: Kevlar.ShieldBuilder.Hedge*
  nameWithType.vb: ShieldBuilder.Hedge(Integer, TimeSpan)
  fullName.vb: Kevlar.ShieldBuilder.Hedge(Integer, System.TimeSpan)
  name.vb: Hedge(Integer, TimeSpan)
