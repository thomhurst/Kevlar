  name: RetryOptions
  nameWithType: RetryOptions
  fullName: Kevlar.RetryOptions
  type: Class
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: Configuration for a retry strategy.
  remarks: >-
    Before each retry, callbacks run in this order: <xref href="Kevlar.RetryOptions.DelayGenerator" data-throw-if-not-resolved="false"></xref>,

    <xref href="Kevlar.RetryOptions.DelayGeneratorAsync" data-throw-if-not-resolved="false"></xref>, <xref href="Kevlar.RetryOptions.OnRetry" data-throw-if-not-resolved="false"></xref>, then <xref href="Kevlar.RetryOptions.OnRetryAsync" data-throw-if-not-resolved="false"></xref>.

    If the caller's cancellation token is cancelled by the time the callbacks complete, the retry

    stops and surfaces caller cancellation.
  example: []
  syntax:
    content: public sealed class RetryOptions
    content.vb: Public NotInheritable Class RetryOptions
  inheritance:
