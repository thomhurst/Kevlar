- uid: Kevlar.RetryOptions.HandlesException
  commentId: P:Kevlar.RetryOptions.HandlesException
  id: HandlesException
  parent: Kevlar.RetryOptions
  langs:
  - csharp
  - vb
  name: HandlesException
  nameWithType: RetryOptions.HandlesException
  fullName: Kevlar.RetryOptions.HandlesException
  type: Property
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Setting this makes this retry ignore the ambient <code>When…</code> handling clause and handle

    only the exceptions this predicate selects.
  remarks: >-
    The ambient clause is started with <code>When…</code> on a shield and continued with <code>Or…</code> on

    the builder it returns, and applies to every reactive strategy chained after it. This

    property replaces that clause for this strategy alone; it does not narrow it.
  example: []
  syntax:
    content: public Func<Exception, bool>? HandlesException { get; set; }
    parameters: []
    return:
      type: System.Func{System.Exception,System.Boolean}
    content.vb: Public Property HandlesException As Func(Of Exception, Boolean)
  overload: Kevlar.RetryOptions.HandlesException*
  seealso:
  - linkId: Kevlar.HandlingClause
    commentId: T:Kevlar.HandlingClause
