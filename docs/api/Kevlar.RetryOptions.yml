- uid: Kevlar.RetryOptions.MaxDelay
  commentId: P:Kevlar.RetryOptions.MaxDelay
  id: MaxDelay
  parent: Kevlar.RetryOptions
  langs:
  - csharp
  - vb
  name: MaxDelay
  nameWithType: RetryOptions.MaxDelay
  fullName: Kevlar.RetryOptions.MaxDelay
  type: Property
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    An absolute upper bound applied to every delay, including delays produced by

    <xref href="Kevlar.RetryOptions.DelayGenerator" data-throw-if-not-resolved="false"></xref> (so a huge <code>Retry-After</code> header cannot stall the pipeline).

    When unset, <xref href="Kevlar.Backoff.MaxDelay" data-throw-if-not-resolved="false"></xref> is used when the backoff provides one.
  example: []
  syntax:
    content: public TimeSpan? MaxDelay { get; set; }
    parameters: []
    return:
      type: System.Nullable{System.TimeSpan}
    content.vb: Public Property MaxDelay As TimeSpan?
  overload: Kevlar.RetryOptions.MaxDelay*
- uid: Kevlar.RetryOptions.OnRetry
  commentId: P:Kevlar.RetryOptions.OnRetry
  id: OnRetry
  parent: Kevlar.RetryOptions
  langs:
  - csharp
  - vb
  name: OnRetry
  nameWithType: RetryOptions.OnRetry
  fullName: Kevlar.RetryOptions.OnRetry
  type: Property
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Invoked and awaited before each retry sleeps. Return <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/default">default</a> from a

    synchronous callback. Do not retain the pooled <xref href="Kevlar.RetryEvent.Context" data-throw-if-not-resolved="false"></xref> after the

    returned task completes.
  example: []
  syntax:
    content: public Func<RetryEvent, ValueTask>? OnRetry { get; set; }
    parameters: []
    return:
      type: System.Func{Kevlar.RetryEvent,System.Threading.Tasks.ValueTask}
    content.vb: Public Property OnRetry As Func(Of RetryEvent, ValueTask)
  overload: Kevlar.RetryOptions.OnRetry*
- uid: Kevlar.RetryOptions.DelayGenerator
  commentId: P:Kevlar.RetryOptions.DelayGenerator
  id: DelayGenerator
  parent: Kevlar.RetryOptions
  langs:
  - csharp
  - vb
  name: DelayGenerator
  nameWithType: RetryOptions.DelayGenerator
  fullName: Kevlar.RetryOptions.DelayGenerator
  type: Property
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Overrides the computed delay for a specific retry. Receives the event with the

    backoff-computed delay; return a non-null value to replace it (for example, from an

    HTTP <code>Retry-After</code> header). <xref href="Kevlar.RetryOptions.MaxDelay" data-throw-if-not-resolved="false"></xref> still caps the returned value.

    When it is unset, <xref href="Kevlar.Backoff.MaxDelay" data-throw-if-not-resolved="false"></xref> caps the value when available.

    The generator is awaited before <xref href="Kevlar.RetryOptions.OnRetry" data-throw-if-not-resolved="false"></xref> runs. Do not retain the pooled

    <xref href="Kevlar.RetryEvent.Context" data-throw-if-not-resolved="false"></xref> after the returned task completes.
  example: []
  syntax:
    content: public Func<RetryEvent, ValueTask<TimeSpan?>>? DelayGenerator { get; set; }
    parameters: []
    return:
      type: System.Func{Kevlar.RetryEvent,System.Threading.Tasks.ValueTask{System.Nullable{System.TimeSpan}}}
    content.vb: Public Property DelayGenerator As Func(Of RetryEvent, ValueTask(Of TimeSpan?))
  overload: Kevlar.RetryOptions.DelayGenerator*
