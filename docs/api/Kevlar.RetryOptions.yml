- uid: Kevlar.RetryOptions.DelayGenerator
  commentId: P:Kevlar.RetryOptions.DelayGenerator
  id: DelayGenerator
  parent: Kevlar.RetryOptions
  langs:
  - csharp
  - vb
  name: DelayGenerator
  nameWithType: RetryOptions.DelayGenerator
  fullName: Kevlar.RetryOptions.DelayGenerator
  type: Property
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Overrides the computed delay for a specific retry. Receives the event with the

    backoff-computed delay; return a non-null value to replace it (for example, from an

    HTTP <code>Retry-After</code> header). <xref href="Kevlar.RetryOptions.MaxDelay" data-throw-if-not-resolved="false"></xref> still caps the returned value.
  example: []
  syntax:
    content: public Func<RetryEvent, TimeSpan?>? DelayGenerator { get; set; }
    parameters: []
    return:
      type: System.Func{Kevlar.RetryEvent,System.Nullable{System.TimeSpan}}
    content.vb: Public Property DelayGenerator As Func(Of RetryEvent, TimeSpan?)
  overload: Kevlar.RetryOptions.DelayGenerator*
- uid: Kevlar.RetryOptions.DelayGeneratorAsync
  commentId: P:Kevlar.RetryOptions.DelayGeneratorAsync
  id: DelayGeneratorAsync
  parent: Kevlar.RetryOptions
  langs:
  - csharp
  - vb
  name: DelayGeneratorAsync
  nameWithType: RetryOptions.DelayGeneratorAsync
  fullName: Kevlar.RetryOptions.DelayGeneratorAsync
  type: Property
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Asynchronously overrides the delay for a specific retry. Receives the delay after

    <xref href="Kevlar.RetryOptions.DelayGenerator" data-throw-if-not-resolved="false"></xref> and <xref href="Kevlar.RetryOptions.MaxDelay" data-throw-if-not-resolved="false"></xref> have been applied; return a

    non-null value to replace it. <xref href="Kevlar.RetryOptions.MaxDelay" data-throw-if-not-resolved="false"></xref> still caps the returned value.

    The callback is awaited before retry notifications run. Do not retain its pooled

    <xref href="Kevlar.RetryEvent.Context" data-throw-if-not-resolved="false"></xref> after the returned task completes.
  example: []
  syntax:
    content: public Func<RetryEvent, ValueTask<TimeSpan?>>? DelayGeneratorAsync { get; set; }
    parameters: []
    return:
      type: System.Func{Kevlar.RetryEvent,System.Threading.Tasks.ValueTask{System.Nullable{System.TimeSpan}}}
    content.vb: Public Property DelayGeneratorAsync As Func(Of RetryEvent, ValueTask(Of TimeSpan?))
  overload: Kevlar.RetryOptions.DelayGeneratorAsync*
