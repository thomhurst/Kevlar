- uid: Kevlar.Shield.Hedge(System.Int32,System.TimeSpan)
  commentId: M:Kevlar.Shield.Hedge(System.Int32,System.TimeSpan)
  id: Hedge(System.Int32,System.TimeSpan)
  parent: Kevlar.Shield
  langs:
  - csharp
  - vb
  name: Hedge(int, TimeSpan)
  nameWithType: Shield.Hedge(int, TimeSpan)
  fullName: Kevlar.Shield.Hedge(int, System.TimeSpan)
  type: Method
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: Races the primary with up to <code class="paramref">maxHedgedAttempts</code> additional attempts staggered by <code class="paramref">delay</code>; first acceptable outcome wins.
  remarks: >-
    Hedging on an untyped <xref href="Kevlar.Shield" data-throw-if-not-resolved="false"></xref> runs the execution delegate more than once,

    concurrently, and only its exceptions can select a winner. The delegate must therefore be

    idempotent: duplicate writes, charges, or sends are otherwise observable side effects of a

    hedge that later loses. Prefer <xref href="Kevlar.Shield.For%60%601" data-throw-if-not-resolved="false"></xref>, where result clauses decide which

    attempt is acceptable, or confirm the action is safe to repeat.
  example: []
  syntax:
    content: public static Shield Hedge(int maxHedgedAttempts, TimeSpan delay)
    parameters:
    - id: maxHedgedAttempts
      type: System.Int32
    - id: delay
      type: System.TimeSpan
    return:
      type: Kevlar.Shield
    content.vb: Public Shared Function Hedge(maxHedgedAttempts As Integer, delay As TimeSpan) As Shield
  overload: Kevlar.Shield.Hedge*
  nameWithType.vb: Shield.Hedge(Integer, TimeSpan)
  fullName.vb: Kevlar.Shield.Hedge(Integer, System.TimeSpan)
  name.vb: Hedge(Integer, TimeSpan)
