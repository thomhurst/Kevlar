- uid: Kevlar.Strategy.InvokeGenerator``2(System.Func{``0,System.Threading.Tasks.ValueTask{``1}},``0,Kevlar.KevlarContext,System.String)
  commentId: M:Kevlar.Strategy.InvokeGenerator``2(System.Func{``0,System.Threading.Tasks.ValueTask{`1}},``0,Kevlar.KevlarContext,System.String)
  id: InvokeGenerator``2(System.Func{``0,System.Threading.Tasks.ValueTask{``1}},``0,Kevlar.KevlarContext,System.String)
  parent: Kevlar.Strategy
  langs:
  - csharp
  - vb
  name: InvokeGenerator<TEvent, TResult>(Func<TEvent, ValueTask<TResult>>, TEvent, KevlarContext, string)
  nameWithType: Strategy.InvokeGenerator<TEvent, TResult>(Func<TEvent, ValueTask<TResult>>, TEvent, KevlarContext, string)
  fullName: Kevlar.Strategy.InvokeGenerator<TEvent, TResult>(System.Func<TEvent, System.Threading.Tasks.ValueTask<TResult>>, TEvent, Kevlar.KevlarContext, string)
  type: Method
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: >-
    Invokes a generator hook whose result the strategy needs. Generator failures propagate to

    the caller. Under synchronous execution a generator that does not complete synchronously

    throws <xref href="System.NotSupportedException" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: protected static ValueTask<TResult> InvokeGenerator<TEvent, TResult>(Func<TEvent, ValueTask<TResult>> generator, TEvent callbackEvent, KevlarContext context, string hookName)
    parameters:
    - id: generator
      type: System.Func{{TEvent},System.Threading.Tasks.ValueTask{{TResult}}}
      description: The generator to invoke.
    - id: callbackEvent
      type: '{TEvent}'
      description: The input passed to the generator.
    - id: context
      type: Kevlar.KevlarContext
      description: The current execution context.
    - id: hookName
      type: System.String
      description: The generator name used in synchronous-execution errors.
    typeParameters:
    - id: TEvent
      description: The generator input type.
    - id: TResult
      description: The generated result type.
    return:
      type: System.Threading.Tasks.ValueTask{{TResult}}
      description: The generator invocation.
    content.vb: Protected Shared Function InvokeGenerator(Of TEvent, TResult)(generator As Func(Of TEvent, ValueTask(Of TResult)), callbackEvent As TEvent, context As KevlarContext, hookName As String) As ValueTask(Of TResult)
  overload: Kevlar.Strategy.InvokeGenerator*
  nameWithType.vb: Strategy.InvokeGenerator(Of TEvent, TResult)(Func(Of TEvent, ValueTask(Of TResult)), TEvent, KevlarContext, String)
  fullName.vb: Kevlar.Strategy.InvokeGenerator(Of TEvent, TResult)(System.Func(Of TEvent, System.Threading.Tasks.ValueTask(Of TResult)), TEvent, Kevlar.KevlarContext, String)
  name.vb: InvokeGenerator(Of TEvent, TResult)(Func(Of TEvent, ValueTask(Of TResult)), TEvent, KevlarContext, String)
