- uid: Kevlar.Strategy.ExecuteAsync``2(Kevlar.Continuation{``0,``1},Kevlar.KevlarContext)
  commentId: M:Kevlar.Strategy.ExecuteAsync``2(Kevlar.Continuation{``0,``1},Kevlar.KevlarContext)
  id: ExecuteAsync``2(Kevlar.Continuation{``0,``1},Kevlar.KevlarContext)
  parent: Kevlar.Strategy
  langs:
  - csharp
  - vb
  name: ExecuteAsync<T, TState>(Continuation<T, TState>, KevlarContext)
  nameWithType: Strategy.ExecuteAsync<T, TState>(Continuation<T, TState>, KevlarContext)
  fullName: Kevlar.Strategy.ExecuteAsync<T, TState>(Kevlar.Continuation<T, TState>, Kevlar.KevlarContext)
  type: Method
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: Executes the strategy around the rest of the pipeline.
  remarks: >-
    Returning an incomplete value task during synchronous shield execution causes the execution

    boundary to block until it completes. Custom implementations should avoid capturing a

    single-threaded synchronization context and should be invoked asynchronously when they yield.
  example: []
  syntax:
    content: public abstract ValueTask<Outcome<T>> ExecuteAsync<T, TState>(Continuation<T, TState> next, KevlarContext context)
    parameters:
    - id: next
      type: Kevlar.Continuation{{T},{TState}}
      description: The remainder of the pipeline, ending in the user's delegate.
    - id: context
      type: Kevlar.KevlarContext
      description: The ambient execution context.
    typeParameters:
    - id: T
      description: The result type of the execution.
    - id: TState
      description: Caller-supplied state threaded through the pipeline without allocation.
    return:
      type: System.Threading.Tasks.ValueTask{Kevlar.Outcome{{T}}}
    content.vb: Public MustOverride Function ExecuteAsync(Of T, TState)([next] As Continuation(Of T, TState), context As KevlarContext) As ValueTask(Of Outcome(Of T))
  overload: Kevlar.Strategy.ExecuteAsync*
  nameWithType.vb: Strategy.ExecuteAsync(Of T, TState)(Continuation(Of T, TState), KevlarContext)
  fullName.vb: Kevlar.Strategy.ExecuteAsync(Of T, TState)(Kevlar.Continuation(Of T, TState), Kevlar.KevlarContext)
  name.vb: ExecuteAsync(Of T, TState)(Continuation(Of T, TState), KevlarContext)
