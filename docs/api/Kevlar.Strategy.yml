- uid: Kevlar.Strategy.InvokesContinuationAtMostOnce
  commentId: P:Kevlar.Strategy.InvokesContinuationAtMostOnce
  id: InvokesContinuationAtMostOnce
  parent: Kevlar.Strategy
  langs:
  - csharp
  - vb
  name: InvokesContinuationAtMostOnce
  nameWithType: Strategy.InvokesContinuationAtMostOnce
  fullName: Kevlar.Strategy.InvokesContinuationAtMostOnce
  type: Property
  assemblies:
  - Kevlar
  namespace: Kevlar
  summary: Gets whether this strategy guarantees invoking its continuation at most once per execution.
  remarks: >-
    Override and return <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> only when every path invokes <code>next</code> zero or

    one time. Strategies that retry, hedge, loop, or otherwise may invoke <code>next</code> more than

    once must retain the conservative default.
  example: []
  syntax:
    content: protected virtual bool InvokesContinuationAtMostOnce { get; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Protected Overridable ReadOnly Property InvokesContinuationAtMostOnce As Boolean
  overload: Kevlar.Strategy.InvokesContinuationAtMostOnce*
