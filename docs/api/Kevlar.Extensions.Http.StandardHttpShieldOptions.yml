- uid: Kevlar.Extensions.Http.StandardHttpShieldOptions.Retry
  commentId: P:Kevlar.Extensions.Http.StandardHttpShieldOptions.Retry
  id: Retry
  parent: Kevlar.Extensions.Http.StandardHttpShieldOptions
  langs:
  - csharp
  - vb
  name: Retry
  nameWithType: StandardHttpShieldOptions.Retry
  fullName: Kevlar.Extensions.Http.StandardHttpShieldOptions.Retry
  type: Property
  assemblies:
  - Kevlar.Extensions.Http
  namespace: Kevlar.Extensions.Http
  summary: >-
    Configures transient retries. Defaults to three jittered exponential retries that honour

    <code>Retry-After</code> headers. Notifications observe the live handled response, which is

    disposed before the next attempt starts.
  example: []
  syntax:
    content: public RetryOptions<HttpResponseMessage> Retry { get; set; }
    parameters: []
    return:
      type: Kevlar.RetryOptions{System.Net.Http.HttpResponseMessage}
    content.vb: Public Property Retry As RetryOptions(Of HttpResponseMessage)
  overload: Kevlar.Extensions.Http.StandardHttpShieldOptions.Retry*
- uid: Kevlar.Extensions.Http.StandardHttpShieldOptions.UseRetryAfterHeader
  commentId: P:Kevlar.Extensions.Http.StandardHttpShieldOptions.UseRetryAfterHeader
  id: UseRetryAfterHeader
  parent: Kevlar.Extensions.Http.StandardHttpShieldOptions
  langs:
  - csharp
  - vb
  name: UseRetryAfterHeader
  nameWithType: StandardHttpShieldOptions.UseRetryAfterHeader
  fullName: Kevlar.Extensions.Http.StandardHttpShieldOptions.UseRetryAfterHeader
  type: Property
  assemblies:
  - Kevlar.Extensions.Http
  namespace: Kevlar.Extensions.Http
  summary: >-
    Whether retry delays honour the response's <code>Retry-After</code> header. Defaults to

    <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> and composes with

    <xref href="Kevlar.RetryOptions%601.DelayGenerator" data-throw-if-not-resolved="false"></xref>

    by using the longer delay.
  example: []
  syntax:
    content: public bool UseRetryAfterHeader { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property UseRetryAfterHeader As Boolean
  overload: Kevlar.Extensions.Http.StandardHttpShieldOptions.UseRetryAfterHeader*
