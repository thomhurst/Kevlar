  name: CircuitBreaker
  nameWithType: StandardHttpShieldOptions.CircuitBreaker
  fullName: Kevlar.Extensions.Http.StandardHttpShieldOptions.CircuitBreaker
  type: Property
  assemblies:
  - Kevlar.Extensions.Http
  namespace: Kevlar.Extensions.Http
  summary: >-
    Configures the circuit breaker. Defaults to a 50% failure ratio over 30 seconds, with a

    minimum throughput of 10 and a 15-second break.
