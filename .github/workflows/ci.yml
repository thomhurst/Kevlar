name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_nuget:
        description: 'Upload package to NuGet'
        type: boolean
        required: false
        default: false
      release_dry_run:
        description: 'Validate the release without creating a tag, publishing packages, or creating a release'
        type: boolean
        required: false
        default: true

jobs:
  allocation-gates:
    name: Allocation gates (.NET 8/10, Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Required for GitVersion
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Run allocation gates
        run: |
          dotnet run --project tests/Kevlar.AllocationTests -c Release -f net8.0 -- --timeout 5m --minimum-expected-tests 3 --zero-tests-policy strict
          dotnet run --project tests/Kevlar.AllocationTests -c Release -f net10.0 -- --timeout 5m --minimum-expected-tests 3 --zero-tests-policy strict

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Required for changelog compare-link validation
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build API reference
        shell: pwsh
        run: ./scripts/Build-ApiDocs.ps1 -SkipMetadata

      - name: Verify documentation structure
        shell: pwsh
        run: ./scripts/Verify-Docs.ps1

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --root-dir "${{ github.workspace }}" --no-progress
            --max-retries 3 --retry-wait-time 2
            --exclude 'https://github\.com/thomhurst/Kevlar/blob/main/(CONTRIBUTING|SECURITY|CODE_OF_CONDUCT)\.md'
            --exclude '^https://github\.com/thomhurst/Kevlar/tree/main/samples/'
            README.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md "docs/docs/**/*.md"
          fail: true
          failIfEmpty: true
          token: ${{ github.token }}

      - name: Install documentation dependencies
        run: npm ci
        working-directory: docs

      - name: Verify repository community files
        shell: pwsh
        run: ./scripts/Verify-Repo.ps1

      - name: Build documentation
        run: npm run build
        working-directory: docs

      - name: Upload documentation site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-site
          path: docs/build
          if-no-files-found: error
          retention-days: 7

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Required for GitVersion

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Verify test suite registration
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: ./.github/scripts/Assert-TestSuiteRegistration.ps1

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

      - name: Verify release workflow and versioning
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          ./scripts/Verify-ReleaseWorkflow.ps1
          ./scripts/Verify-Versioning.ps1

      - name: Build
        run: dotnet build Kevlar.slnx -c Release -p:Version=${{ steps.gitversion.outputs.semVer }}

      - name: Unit tests
        shell: pwsh
        run: |
          dotnet run --project tests/Kevlar.Tests -c Release -f net8.0 --no-build -- --timeout 5m --minimum-expected-tests 750 --zero-tests-policy strict --report-trx --report-trx-filename unit-net8.trx --results-directory artifacts/test-results/unit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Kevlar.Tests -c Release -f net10.0 --no-build -- --timeout 5m --minimum-expected-tests 750 --zero-tests-policy strict --report-trx --report-trx-filename unit-net10.trx --results-directory artifacts/test-results/unit

      - name: Chaos tests
        shell: pwsh
        run: |
          dotnet run --project tests/Kevlar.Chaos.Tests -c Release -f net8.0 --no-build -- --timeout 5m --minimum-expected-tests 25 --zero-tests-policy strict --report-trx --report-trx-filename chaos-net8.trx --results-directory artifacts/test-results/chaos
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Kevlar.Chaos.Tests -c Release -f net10.0 --no-build -- --timeout 5m --minimum-expected-tests 25 --zero-tests-policy strict --report-trx --report-trx-filename chaos-net10.trx --results-directory artifacts/test-results/chaos

      - name: Compatibility asset tests
        run: dotnet run --project tests/Kevlar.NetStandard.Tests -c Release -f net10.0 --no-build -- --timeout 5m --minimum-expected-tests 10 --zero-tests-policy strict --report-trx --report-trx-filename netstandard.trx --results-directory artifacts/test-results/netstandard

      - name: .NET Framework compatibility asset tests
        if: matrix.os == 'windows-latest'
        run: dotnet run --project tests/Kevlar.NetStandard.Tests -c Release -f net48 --no-build

      - name: Modern gRPC compatibility asset tests
        run: dotnet run --project tests/Kevlar.NetStandard21.Tests -c Release --no-build -- --timeout 5m --minimum-expected-tests 4 --zero-tests-policy strict --report-trx --report-trx-filename netstandard21.trx --results-directory artifacts/test-results/netstandard21

      - name: Observability contract (.NET 8)
        run: dotnet run --project tests/Kevlar.Observability.Net8.Tests -c Release --no-build -- --timeout 5m --minimum-expected-tests 2 --zero-tests-policy strict --report-trx --report-trx-filename observability-net8.trx --results-directory artifacts/test-results/observability-net8

      - name: Integration tests
        run: dotnet run --project tests/Kevlar.IntegrationTests -c Release --no-build -- --timeout 5m --minimum-expected-tests 100 --zero-tests-policy strict --report-trx --report-trx-filename integration.trx --results-directory artifacts/test-results/integration

      - name: Analyzer tests
        run: dotnet run --project tests/Kevlar.Analyzers.Tests -c Release --no-build -- --timeout 5m --minimum-expected-tests 65 --zero-tests-policy strict --report-trx --report-trx-filename analyzers.trx --results-directory artifacts/test-results/analyzers

      - name: Testing package tests
        shell: pwsh
        run: |
          dotnet run --project tests/Kevlar.Testing.Tests -c Release -f net8.0 --no-build -- --timeout 5m --minimum-expected-tests 45 --zero-tests-policy strict --report-trx --report-trx-filename testing-net8.trx --results-directory artifacts/test-results/testing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Kevlar.Testing.Tests -c Release -f net10.0 --no-build -- --timeout 5m --minimum-expected-tests 45 --zero-tests-policy strict --report-trx --report-trx-filename testing-net10.trx --results-directory artifacts/test-results/testing

      - name: Rate limiting adapter tests
        shell: pwsh
        run: |
          dotnet run --project tests/Kevlar.Extensions.RateLimiting.Tests -c Release -f net8.0 --no-build -- --timeout 5m --minimum-expected-tests 20 --zero-tests-policy strict --report-trx --report-trx-filename rate-limiting-net8.trx --results-directory artifacts/test-results/rate-limiting
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Kevlar.Extensions.RateLimiting.Tests -c Release -f net10.0 --no-build -- --timeout 5m --minimum-expected-tests 20 --zero-tests-policy strict --report-trx --report-trx-filename rate-limiting-net10.trx --results-directory artifacts/test-results/rate-limiting

      - name: Logging integration tests
        shell: pwsh
        run: |
          dotnet run --project tests/Kevlar.Extensions.Logging.Tests -c Release -f net8.0 --no-build -- --timeout 5m --minimum-expected-tests 19 --zero-tests-policy strict --report-trx --report-trx-filename logging-net8.trx --results-directory artifacts/test-results/logging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Kevlar.Extensions.Logging.Tests -c Release -f net10.0 --no-build -- --timeout 5m --minimum-expected-tests 19 --zero-tests-policy strict --report-trx --report-trx-filename logging-net10.trx --results-directory artifacts/test-results/logging

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-reports-${{ matrix.os }}
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack Kevlar.slnx -c Release --no-build -p:Version=${{ steps.gitversion.outputs.semVer }}

      - name: Restore local tools
        if: matrix.os == 'ubuntu-latest'
        run: dotnet tool restore

      - name: Install NativeAOT prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev

      - name: Verify packages
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.gitversion.outputs.semVer }}
        run: ./scripts/Verify-Packages.ps1 -PackagesPath artifacts/package/release -Version $env:PACKAGE_VERSION

      - name: Validate Renovate configuration
        if: matrix.os == 'ubuntu-latest'
        run: npx --yes --package renovate -- renovate-config-validator renovate.json

      - name: Verify changelog and release notes
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.gitversion.outputs.semVer }}
        run: |
          ./scripts/Verify-Changelog.ps1
          $notes = ./scripts/Get-ReleaseNotes.ps1 -Version $env:RELEASE_VERSION
          if ([string]::IsNullOrWhiteSpace(($notes | Out-String))) { throw "$env:RELEASE_VERSION release notes are empty." }

      - name: Build API reference
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: ./scripts/Build-ApiDocs.ps1 -SkipBuild

      - name: Verify API reference
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          ./scripts/Verify-ApiDocs.ps1
          $apiChanges = @(git status --porcelain -- docs/api)
          if ($apiChanges.Count -gt 0) {
            $apiChanges | Write-Host
            throw 'Generated API metadata is stale.'
          }

      - name: Build samples from packed packages
        if: matrix.os == 'ubuntu-latest'
        env:
          PACKAGE_VERSION: ${{ steps.gitversion.outputs.semVer }}
        run: dotnet build samples/Samples.slnx -c Release -warnaserror -p:UsePackedPackages=true -p:KevlarSamplePackageVersion=${{ steps.gitversion.outputs.semVer }}

      - name: Run packed sample smoke tests
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.gitversion.outputs.semVer }}
        run: ./scripts/Run-SampleSmokes.ps1 -UsePackedPackages -Version $env:PACKAGE_VERSION

      - name: Verify documentation structure
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: ./scripts/Verify-Docs.ps1

      - name: Compile and execute documentation snippets
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.gitversion.outputs.semVer }}
        run: ./scripts/Verify-DocSnippets.ps1 -PackagesPath artifacts/package/release -Version $env:PACKAGE_VERSION -NoImplicitUsings

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-packages
          path: |
            artifacts/package/release/*.nupkg
            artifacts/package/release/*.snupkg
          if-no-files-found: error

  coverage:
    name: Coverage
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build Kevlar.slnx -c Release

      - name: Prepare coverage output
        run: mkdir -p artifacts/coverage/raw

      - name: Collect unit coverage
        run: dotnet run --project tests/Kevlar.Tests -c Release -f net10.0 --no-build -- --timeout 5m --minimum-expected-tests 750 --zero-tests-policy strict --coverage --coverage-settings .github/coverage.runsettings --coverage-output ${{ github.workspace }}/artifacts/coverage/raw/unit.cobertura.xml --coverage-output-format cobertura

      - name: Collect chaos coverage
        run: dotnet run --project tests/Kevlar.Chaos.Tests -c Release -f net10.0 --no-build -- --timeout 5m --minimum-expected-tests 25 --zero-tests-policy strict --coverage --coverage-settings .github/coverage.runsettings --coverage-output ${{ github.workspace }}/artifacts/coverage/raw/chaos.cobertura.xml --coverage-output-format cobertura

      - name: Collect compatibility asset coverage
        run: dotnet run --project tests/Kevlar.NetStandard.Tests -c Release -f net10.0 --no-build -- --timeout 5m --minimum-expected-tests 10 --zero-tests-policy strict --coverage --coverage-settings .github/coverage.runsettings --coverage-output ${{ github.workspace }}/artifacts/coverage/raw/netstandard.cobertura.xml --coverage-output-format cobertura

      - name: Collect modern gRPC compatibility asset coverage
        run: dotnet run --project tests/Kevlar.NetStandard21.Tests -c Release --no-build -- --timeout 5m --minimum-expected-tests 4 --zero-tests-policy strict --coverage --coverage-settings .github/coverage.runsettings --coverage-output ${{ github.workspace }}/artifacts/coverage/raw/netstandard21.cobertura.xml --coverage-output-format cobertura

      - name: Collect integration coverage
        run: dotnet run --project tests/Kevlar.IntegrationTests -c Release --no-build -- --timeout 5m --minimum-expected-tests 100 --zero-tests-policy strict --coverage --coverage-settings .github/coverage.runsettings --coverage-output ${{ github.workspace }}/artifacts/coverage/raw/integration.cobertura.xml --coverage-output-format cobertura

      - name: Collect analyzer coverage
        run: dotnet run --project tests/Kevlar.Analyzers.Tests -c Release --no-build -- --timeout 5m --minimum-expected-tests 65 --zero-tests-policy strict --coverage --coverage-settings .github/coverage.runsettings --coverage-output ${{ github.workspace }}/artifacts/coverage/raw/analyzers.cobertura.xml --coverage-output-format cobertura

      - name: Collect testing package coverage
        run: dotnet run --project tests/Kevlar.Testing.Tests -c Release -f net10.0 --no-build -- --timeout 5m --minimum-expected-tests 45 --zero-tests-policy strict --coverage --coverage-settings .github/coverage.runsettings --coverage-output ${{ github.workspace }}/artifacts/coverage/raw/testing.cobertura.xml --coverage-output-format cobertura

      - name: Collect rate limiting adapter coverage
        run: dotnet run --project tests/Kevlar.Extensions.RateLimiting.Tests -c Release -f net10.0 --no-build -- --timeout 5m --minimum-expected-tests 20 --zero-tests-policy strict --coverage --coverage-settings .github/coverage.runsettings --coverage-output ${{ github.workspace }}/artifacts/coverage/raw/rate-limiting.cobertura.xml --coverage-output-format cobertura

      - name: Merge coverage reports
        run: dotnet reportgenerator '-reports:artifacts/coverage/raw/*.cobertura.xml' '-targetdir:artifacts/coverage/report' '-reporttypes:Cobertura;Html'

      - name: Enforce coverage baseline
        shell: pwsh
        run: ./.github/scripts/Assert-Coverage.ps1 -Report artifacts/coverage/report/Cobertura.xml -MinimumLinePercent 94 -MinimumBranchPercent 89

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: artifacts/coverage/
          if-no-files-found: error
          retention-days: 14

  # Only reachable from a manual run with the "Upload package to NuGet"
  # checkbox ticked, and only after tests, coverage, and allocation gates are green.
  publish:
    name: Publish NuGet
    needs: [allocation-gates, docs, build-and-test, coverage]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_nuget == true
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write  # Request a NuGet trusted publishing token
      contents: write  # Create the release tag so GitVersion advances past this version

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Required for GitVersion

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nuget-packages
          path: packages

      - name: Verify publish artifacts
        shell: pwsh
        run: |
          $packageIds = @(Get-ChildItem packages -Filter *.nupkg | ForEach-Object { $_.BaseName -replace '\.[0-9].*$', '' } | Sort-Object)
          $symbolPackageIds = @(Get-ChildItem packages -Filter *.snupkg | ForEach-Object { $_.BaseName -replace '\.[0-9].*$', '' } | Sort-Object)
          if ($packageIds.Count -ne 8 -or ($packageIds -join ',') -ne ($symbolPackageIds -join ',')) {
            throw "Expected 8 matching nupkg/snupkg artifacts; got nupkg=[$($packageIds -join ', ')], snupkg=[$($symbolPackageIds -join ', ')]."
          }

      - name: Extract release notes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.gitversion.outputs.semVer }}
        run: |
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          ./scripts/Get-ReleaseNotes.ps1 -Version $env:RELEASE_VERSION -OutputPath $notesPath
          "RELEASE_NOTES_PATH=$notesPath" >> $env:GITHUB_ENV

      - name: Create and push release tag
        if: inputs.release_dry_run != true
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.gitversion.outputs.semVer }}
        run: |
          ./scripts/Push-ReleaseTag.ps1 -Version $env:RELEASE_VERSION -Commit $env:GITHUB_SHA

      - name: NuGet login
        if: inputs.release_dry_run != true
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        if: inputs.release_dry_run != true
        shell: pwsh
        run: |
          ./scripts/Push-NuGetRelease.ps1 -PackagesPath packages -ApiKey '${{ steps.login.outputs.NUGET_API_KEY }}'

      - name: Create GitHub release
        if: inputs.release_dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: ./scripts/Publish-GitHubRelease.ps1 -Tag "v${{ steps.gitversion.outputs.semVer }}" -NotesPath $env:RELEASE_NOTES_PATH -AssetsPath packages
