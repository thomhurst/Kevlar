name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_nuget:
        description: 'Upload package to NuGet'
        type: boolean
        required: false
        default: false

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for GitVersion

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0

      - name: Build
        run: dotnet build Kevlar.slnx -c Release -p:Version=${{ steps.gitversion.outputs.semVer }}

      - name: Test
        run: dotnet run --project tests/Kevlar.Tests -c Release --no-build -- --timeout 5m

      - name: Integration test
        run: dotnet run --project tests/Kevlar.IntegrationTests -c Release --no-build -- --timeout 5m

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack Kevlar.slnx -c Release --no-build -p:Version=${{ steps.gitversion.outputs.semVer }}

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/package/release/*.nupkg

  # Only reachable from a manual run with the "Upload package to NuGet"
  # checkbox ticked, and only after both OS legs are green.
  publish:
    name: Publish NuGet
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' && inputs.publish_nuget == true
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Request a NuGet trusted publishing token
      contents: write  # Create the release tag so GitVersion advances past this version

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for GitVersion

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: packages

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push packages/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ steps.gitversion.outputs.semVer }}" --target ${{ github.sha }} --generate-notes packages/*.nupkg
