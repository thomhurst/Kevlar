name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review starts CI for a reviewed draft; converted_to_draft cancels an in-progress run.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # Publishing the draft release that release-draft.yml keeps for main runs every gate below on
  # the release's tag, then the publish job pushes the packages, stamped with the tag's version.
  release:
    types: [published]
  workflow_dispatch:

# Supersede in-progress PR runs; push, release, and dispatch runs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Routes the path-specific pull-request legs (model sweep, stress smoke). They run
  # inside this workflow so that `CI Passed` can require them; a path filter on a
  # separate workflow would leave a required check that never starts.
  changes:
    name: Detect changes
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      model: ${{ steps.filter.outputs.model }}
      stress: ${{ steps.filter.outputs.stress }}
    steps:
      # dorny/paths-filter@v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            model:
              - 'src/Kevlar/**'
              - 'tests/Kevlar.Tests/**'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'Kevlar.slnx'
              - '.github/workflows/model-tests.yml'
              - '.github/workflows/ci.yml'
            stress:
              - 'src/Kevlar/**'
              - 'benchmarks/Kevlar.StressTests/**'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - '.github/workflows/stress-run.yml'
              - '.github/workflows/ci.yml'
              - '.github/scripts/stress_docs.py'
              - '.github/scripts/publish_stress_docs.sh'
              - '.github/scripts/test_stress_publish.py'

  model-tests:
    name: Model tests
    needs: changes
    if: needs.changes.outputs.model == 'true'
    uses: ./.github/workflows/model-tests.yml

  stress-smoke:
    name: Stress smoke
    needs: changes
    if: needs.changes.outputs.stress == 'true'
    uses: ./.github/workflows/stress-run.yml
    with:
      smoke: true

  measurement-publication:
    name: Measurement docs publication
    # Drafts are reviewed before CI; skip before renting a runner (ready_for_review starts CI).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify publication and deployment retries
        run: |
          python3 -m pip install 'PyYAML>=6,<7'
          bash -n .github/scripts/publish_measurement_docs.sh
          python3 .github/scripts/test_measurement_publish.py

  allocation-gates:
    name: Allocation gates (.NET 10/11, Ubuntu)
    # Drafts are reviewed before CI; skip before renting a runner (ready_for_review starts CI).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Required for GitVersion
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Run allocation gates
        run: |
          dotnet run --project tests/Kevlar.AllocationTests -c Release -f net10.0 -- --timeout 5m --minimum-expected-tests 3 --zero-tests-policy strict
          dotnet run --project tests/Kevlar.AllocationTests -c Release -f net11.0 -- --timeout 5m --minimum-expected-tests 3 --zero-tests-policy strict

  docs:
    name: Documentation site
    # Drafts are reviewed before CI; skip before renting a runner (ready_for_review starts CI).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Required for GitVersion
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build API reference
        shell: pwsh
        run: ./scripts/Build-ApiDocs.ps1

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --root-dir "${{ github.workspace }}" --no-progress
            --max-retries 3 --retry-wait-time 2
            --accept '100..=103,200..=299,502,503,504'
            --exclude 'https://github\.com/thomhurst/Kevlar/blob/main/(CONTRIBUTING|CODE_OF_CONDUCT)\.md'
            --exclude '^https://github\.com/thomhurst/Kevlar/tree/main/samples/'
            --exclude '^https://www\.nuget\.org/packages/Kevlar\.Extensions\.Logging/?$'
            --exclude '^https://www\.nuget\.org/packages/Kevlar\.Extensions\.Tracing/?$'
            README.md CONTRIBUTING.md CODE_OF_CONDUCT.md "docs/docs/**/*.md"
          fail: true
          failIfEmpty: true
          token: ${{ github.token }}

      - name: Install documentation dependencies
        run: npm ci
        working-directory: docs

      - name: Build documentation
        run: npm run build
        working-directory: docs

      - name: Use Ubuntu archive for browser dependencies
        # Azure mirror downloads stalled until the docs job timed out (issue #657).
        run: |
          sudo find /etc/apt -type f \
            \( -name '*.list' -o -name '*.sources' -o -name 'apt-mirrors*.txt' \) \
            -exec sed -i -E 's|https?://azure\.archive\.ubuntu\.com/|https://archive.ubuntu.com/|g' {} +

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: docs

      - name: Test documentation UI
        run: npm run test:e2e
        working-directory: docs

      - name: Upload documentation site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-site
          path: docs/build
          if-no-files-found: error
          retention-days: 7

  build-and-test:
    # Drafts are reviewed before CI; skip before renting a runner (ready_for_review starts CI).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Required for GitVersion

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: |
            7.0.x
            10.0.x
            11.0.x

      - name: Verify test suite registration
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: ./.github/scripts/Assert-TestSuiteRegistration.ps1

      # GitVersion, or the tag of a published release (which must be a version on main).
      - name: Resolve version
        id: version
        uses: ./.github/actions/resolve-version

      - name: Install GitVersion for versioning checks
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'release'
        uses: gittools/actions/gitversion/setup@389fe43e6b0189b98c40c43553070ac029304635 # v5.0.0
        with:
          versionSpec: '7.0.x'

      - name: Verify release workflow and versioning
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          ./scripts/Verify-ReleaseWorkflow.ps1
          ./scripts/Verify-Versioning.ps1

      - name: Build
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.semVer }}
        run: dotnet build Kevlar.slnx -c Release "-p:Version=$env:PACKAGE_VERSION"

      - name: Unit tests
        shell: pwsh
        run: |
          dotnet run --project tests/Kevlar.Tests -c Release -f net10.0 --no-build -- --timeout 5m --minimum-expected-tests 750 --zero-tests-policy strict --report-trx --report-trx-filename unit-net10.trx --results-directory "${{ github.workspace }}/artifacts/test-results/unit"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Kevlar.Tests -c Release -f net11.0 --no-build -- --timeout 5m --minimum-expected-tests 750 --zero-tests-policy strict --report-trx --report-trx-filename unit-net11.trx --results-directory "${{ github.workspace }}/artifacts/test-results/unit"

      - name: Chaos tests
        shell: pwsh
        run: |
          dotnet run --project tests/Kevlar.Chaos.Tests -c Release -f net10.0 --no-build -- --timeout 5m --minimum-expected-tests 25 --zero-tests-policy strict --report-trx --report-trx-filename chaos-net10.trx --results-directory "${{ github.workspace }}/artifacts/test-results/chaos"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Kevlar.Chaos.Tests -c Release -f net11.0 --no-build -- --timeout 5m --minimum-expected-tests 25 --zero-tests-policy strict --report-trx --report-trx-filename chaos-net11.trx --results-directory "${{ github.workspace }}/artifacts/test-results/chaos"

      - name: Compatibility asset tests
        run: dotnet run --project tests/Kevlar.NetStandard.Tests -c Release -f net10.0 --no-build -- --timeout 5m --minimum-expected-tests 10 --zero-tests-policy strict --report-trx --report-trx-filename netstandard.trx --results-directory "${{ github.workspace }}/artifacts/test-results/netstandard"

      - name: .NET Framework compatibility asset tests
        if: matrix.os == 'windows-latest'
        run: dotnet run --project tests/Kevlar.NetStandard.Tests -c Release -f net48 --no-build

      - name: Modern gRPC compatibility asset tests
        run: dotnet run --project tests/Kevlar.NetStandard21.Tests -c Release --no-build -- --timeout 5m --minimum-expected-tests 4 --zero-tests-policy strict --report-trx --report-trx-filename netstandard21.trx --results-directory "${{ github.workspace }}/artifacts/test-results/netstandard21"

      - name: Integration tests
        run: dotnet run --project tests/Kevlar.IntegrationTests -c Release --no-build -- --timeout 5m --minimum-expected-tests 100 --zero-tests-policy strict --report-trx --report-trx-filename integration.trx --results-directory "${{ github.workspace }}/artifacts/test-results/integration"

      - name: Analyzer tests
        run: dotnet run --project tests/Kevlar.Analyzers.Tests -c Release --no-build -- --timeout 5m --minimum-expected-tests 65 --zero-tests-policy strict --report-trx --report-trx-filename analyzers.trx --results-directory "${{ github.workspace }}/artifacts/test-results/analyzers"

      - name: Testing package tests
        shell: pwsh
        run: |
          dotnet run --project tests/Kevlar.Testing.Tests -c Release -f net10.0 --no-build -- --timeout 5m --minimum-expected-tests 45 --zero-tests-policy strict --report-trx --report-trx-filename testing-net10.trx --results-directory "${{ github.workspace }}/artifacts/test-results/testing"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Kevlar.Testing.Tests -c Release -f net11.0 --no-build -- --timeout 5m --minimum-expected-tests 45 --zero-tests-policy strict --report-trx --report-trx-filename testing-net11.trx --results-directory "${{ github.workspace }}/artifacts/test-results/testing"

      - name: Rate limiting adapter tests
        shell: pwsh
        run: |
          dotnet run --project tests/Kevlar.Extensions.RateLimiting.Tests -c Release -f net10.0 --no-build -- --timeout 5m --minimum-expected-tests 20 --zero-tests-policy strict --report-trx --report-trx-filename rate-limiting-net10.trx --results-directory "${{ github.workspace }}/artifacts/test-results/rate-limiting"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Kevlar.Extensions.RateLimiting.Tests -c Release -f net11.0 --no-build -- --timeout 5m --minimum-expected-tests 20 --zero-tests-policy strict --report-trx --report-trx-filename rate-limiting-net11.trx --results-directory "${{ github.workspace }}/artifacts/test-results/rate-limiting"

      - name: Logging integration tests
        shell: pwsh
        run: |
          dotnet run --project tests/Kevlar.Extensions.Logging.Tests -c Release -f net10.0 --no-build -- --timeout 5m --minimum-expected-tests 19 --zero-tests-policy strict --report-trx --report-trx-filename logging-net10.trx --results-directory "${{ github.workspace }}/artifacts/test-results/logging"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Kevlar.Extensions.Logging.Tests -c Release -f net11.0 --no-build -- --timeout 5m --minimum-expected-tests 19 --zero-tests-policy strict --report-trx --report-trx-filename logging-net11.trx --results-directory "${{ github.workspace }}/artifacts/test-results/logging"

      - name: Tracing integration tests
        shell: pwsh
        run: |
          dotnet run --project tests/Kevlar.Extensions.Tracing.Tests -c Release -f net10.0 --no-build -- --timeout 5m --minimum-expected-tests 20 --zero-tests-policy strict --report-trx --report-trx-filename tracing-net10.trx --results-directory "${{ github.workspace }}/artifacts/test-results/tracing"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Kevlar.Extensions.Tracing.Tests -c Release -f net11.0 --no-build -- --timeout 5m --minimum-expected-tests 20 --zero-tests-policy strict --report-trx --report-trx-filename tracing-net11.trx --results-directory "${{ github.workspace }}/artifacts/test-results/tracing"
      - name: Outage measurement accounting tests
        run: dotnet run --project tests/Kevlar.OutageTests.Tests -c Release --no-build -- --timeout 5m --minimum-expected-tests 4 --zero-tests-policy strict --report-trx --report-trx-filename outage.trx --results-directory "${{ github.workspace }}/artifacts/test-results/outage"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports-${{ matrix.os }}
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.semVer }}
        run: dotnet pack Kevlar.slnx -c Release --no-build "-p:Version=$PACKAGE_VERSION"

      - name: Restore local tools
        if: matrix.os == 'ubuntu-latest'
        run: dotnet tool restore

      - name: Install NativeAOT prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev

      - name: Verify packages
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.semVer }}
        run: ./scripts/Verify-Packages.ps1 -PackagesPath artifacts/package/release -Version $env:PACKAGE_VERSION

      - name: Verify analyzer compatibility with .NET 7 SDK
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.semVer }}
        run: ./scripts/Verify-AnalyzerCompatibility.ps1 -PackagesPath artifacts/package/release -Version $env:PACKAGE_VERSION

      - name: Validate Renovate configuration
        if: matrix.os == 'ubuntu-latest'
        run: npx --yes --package renovate -- renovate-config-validator renovate.json

      - name: Build samples from packed packages
        if: matrix.os == 'ubuntu-latest'
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.semVer }}
        run: dotnet build samples/Samples.slnx -c Release -warnaserror -p:UsePackedPackages=true "-p:KevlarSamplePackageVersion=$PACKAGE_VERSION"

      - name: Run packed sample smoke tests
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.semVer }}
        run: ./scripts/Run-SampleSmokes.ps1 -UsePackedPackages -Version $env:PACKAGE_VERSION

      - name: Verify documentation analyzer trust
        shell: pwsh
        run: ./scripts/Test-DocSnippetAnalyzers.ps1

      - name: Compile and execute documentation snippets
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.semVer }}
        run: ./scripts/Verify-DocSnippets.ps1 -PackagesPath artifacts/package/release -Version $env:PACKAGE_VERSION -NoImplicitUsings

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nuget-packages
          path: |
            artifacts/package/release/*.nupkg
            artifacts/package/release/*.snupkg
          if-no-files-found: error

  coverage:
    name: Coverage
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build Kevlar.slnx -c Release

      - name: Prepare coverage output
        run: mkdir -p artifacts/coverage/raw

      - name: Collect unit coverage
        run: dotnet run --project tests/Kevlar.Tests -c Release -f net10.0 --no-build -- --timeout 5m --minimum-expected-tests 750 --zero-tests-policy strict --coverage --coverage-settings "${{ github.workspace }}/.github/coverage.runsettings" --coverage-output "${{ github.workspace }}/artifacts/coverage/raw/unit.cobertura.xml" --coverage-output-format cobertura

      - name: Collect chaos coverage
        run: dotnet run --project tests/Kevlar.Chaos.Tests -c Release -f net10.0 --no-build -- --timeout 5m --minimum-expected-tests 25 --zero-tests-policy strict --coverage --coverage-settings "${{ github.workspace }}/.github/coverage.runsettings" --coverage-output "${{ github.workspace }}/artifacts/coverage/raw/chaos.cobertura.xml" --coverage-output-format cobertura

      - name: Collect compatibility asset coverage
        run: dotnet run --project tests/Kevlar.NetStandard.Tests -c Release -f net10.0 --no-build -- --timeout 5m --minimum-expected-tests 10 --zero-tests-policy strict --coverage --coverage-settings "${{ github.workspace }}/.github/coverage.runsettings" --coverage-output "${{ github.workspace }}/artifacts/coverage/raw/netstandard.cobertura.xml" --coverage-output-format cobertura

      - name: Collect modern gRPC compatibility asset coverage
        run: dotnet run --project tests/Kevlar.NetStandard21.Tests -c Release --no-build -- --timeout 5m --minimum-expected-tests 4 --zero-tests-policy strict --coverage --coverage-settings "${{ github.workspace }}/.github/coverage.runsettings" --coverage-output "${{ github.workspace }}/artifacts/coverage/raw/netstandard21.cobertura.xml" --coverage-output-format cobertura

      - name: Collect integration coverage
        run: dotnet run --project tests/Kevlar.IntegrationTests -c Release --no-build -- --timeout 5m --minimum-expected-tests 100 --zero-tests-policy strict --coverage --coverage-settings "${{ github.workspace }}/.github/coverage.runsettings" --coverage-output "${{ github.workspace }}/artifacts/coverage/raw/integration.cobertura.xml" --coverage-output-format cobertura

      - name: Collect analyzer coverage
        run: dotnet run --project tests/Kevlar.Analyzers.Tests -c Release --no-build -- --timeout 5m --minimum-expected-tests 65 --zero-tests-policy strict --coverage --coverage-settings "${{ github.workspace }}/.github/coverage.runsettings" --coverage-output "${{ github.workspace }}/artifacts/coverage/raw/analyzers.cobertura.xml" --coverage-output-format cobertura

      - name: Collect testing package coverage
        run: dotnet run --project tests/Kevlar.Testing.Tests -c Release -f net10.0 --no-build -- --timeout 5m --minimum-expected-tests 45 --zero-tests-policy strict --coverage --coverage-settings "${{ github.workspace }}/.github/coverage.runsettings" --coverage-output "${{ github.workspace }}/artifacts/coverage/raw/testing.cobertura.xml" --coverage-output-format cobertura

      - name: Collect rate limiting adapter coverage
        run: dotnet run --project tests/Kevlar.Extensions.RateLimiting.Tests -c Release -f net10.0 --no-build -- --timeout 5m --minimum-expected-tests 20 --zero-tests-policy strict --coverage --coverage-settings "${{ github.workspace }}/.github/coverage.runsettings" --coverage-output "${{ github.workspace }}/artifacts/coverage/raw/rate-limiting.cobertura.xml" --coverage-output-format cobertura

      - name: Collect logging integration coverage
        run: dotnet run --project tests/Kevlar.Extensions.Logging.Tests -c Release -f net10.0 --no-build -- --timeout 5m --minimum-expected-tests 19 --zero-tests-policy strict --coverage --coverage-settings "${{ github.workspace }}/.github/coverage.runsettings" --coverage-output "${{ github.workspace }}/artifacts/coverage/raw/logging.cobertura.xml" --coverage-output-format cobertura

      - name: Collect tracing integration coverage
        run: dotnet run --project tests/Kevlar.Extensions.Tracing.Tests -c Release -f net10.0 --no-build -- --timeout 5m --minimum-expected-tests 20 --zero-tests-policy strict --coverage --coverage-settings "${{ github.workspace }}/.github/coverage.runsettings" --coverage-output "${{ github.workspace }}/artifacts/coverage/raw/tracing.cobertura.xml" --coverage-output-format cobertura

      - name: Merge coverage reports
        run: dotnet reportgenerator '-reports:artifacts/coverage/raw/*.cobertura.xml' '-targetdir:artifacts/coverage/report' '-reporttypes:Cobertura;Html'

      - name: Enforce coverage baseline
        shell: pwsh
        run: ./.github/scripts/Assert-Coverage.ps1 -Report artifacts/coverage/report/Cobertura.xml -MinimumLinePercent 94 -MinimumBranchPercent 89

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: artifacts/coverage/
          if-no-files-found: error
          retention-days: 14

  # The only required check on main. Every job above except `publish` MUST be listed in
  # `needs`, or its failure would not block merging. Path-skipped legs pass; a failed or
  # cancelled job fails it. A draft run skips this job, and GitHub reports a skipped
  # job under its unevaluated name expression, so a draft can never post `CI Passed`.
  ci-passed:
    name: ${{ needs.build-and-test.result == 'skipped' && 'CI Passed (not run)' || 'CI Passed' }}
    needs: [changes, model-tests, stress-smoke, measurement-publication, allocation-gates, docs, build-and-test, coverage]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify every CI job passed or was skipped by its path filter
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::CI jobs did not pass: $failed"
            exit 1
          fi

  # Only reachable by publishing a GitHub release (the draft that release-draft.yml keeps for
  # main), and only after tests, coverage, and allocation gates are green on the tagged commit.
  # GitHub has already created the tag and the release; this job pushes the packages to NuGet and
  # attaches them to the release. Re-running a failed run is safe: packages already on NuGet with
  # the same payload are skipped, and release assets are replaced.
  # NuGet trusted publishing matches this workflow file and the `nuget` environment: keep both.
  publish:
    name: Publish NuGet
    needs: [allocation-gates, docs, build-and-test, coverage]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write  # Request a NuGet trusted publishing token
      contents: write  # Attach the packages to the release and name it after its tag

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # The release commit must be checked against main
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      # Fails unless the release tag is a version whose commit is on main.
      - name: Resolve version
        id: version
        uses: ./.github/actions/resolve-version

      # The draft was named, and its compare link written, for the version GitVersion suggested.
      # Follow the tag if it was edited before publishing, and drop the draft marker. Only the
      # generated "**Full Changelog**" line and the marker line change; other text is kept. It
      # runs before anything that can fail after the version is resolved, and is cosmetic, so it
      # never blocks a release.
      - name: Name release after its tag
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.semVer }}
          DRAFT_MARKER: '<!-- kevlar-release-draft -->'
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          body=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.body // ""')
          body=$(printf '%s\n' "$body" | tr -d '\r' | { grep -vxF -- "$DRAFT_MARKER" || true; } |
            sed -E "s#^(\*\*Full Changelog\*\*: https://github\.com/[^ ]+/compare/[^ ]+)\.\.\.[^ ]+\$#\1...$RELEASE_TAG#")
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -f name="$RELEASE_VERSION" -f body="$body" > /dev/null

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nuget-packages
          path: packages

      - name: Verify publish artifacts
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.semVer }}
        run: |
          $expectedPackageIds = @(./scripts/Get-PackablePackageIds.ps1)
          $packageIds = @(Get-ChildItem packages -Filter *.nupkg | ForEach-Object { $_.BaseName -replace '\.[0-9].*$', '' } | Sort-Object)
          $symbolPackageIds = @(Get-ChildItem packages -Filter *.snupkg | ForEach-Object { $_.BaseName -replace '\.[0-9].*$', '' } | Sort-Object)
          if (($packageIds -join ',') -ne ($expectedPackageIds -join ',') -or ($symbolPackageIds -join ',') -ne ($expectedPackageIds -join ',')) {
            throw "Expected nupkg/snupkg artifacts for [$($expectedPackageIds -join ', ')]; got nupkg=[$($packageIds -join ', ')], snupkg=[$($symbolPackageIds -join ', ')]."
          }
          $wrongVersion = @(Get-ChildItem packages -File | Where-Object { -not $_.Name.EndsWith(".$env:RELEASE_VERSION$($_.Extension)", [StringComparison]::OrdinalIgnoreCase) })
          if ($wrongVersion.Count -gt 0) {
            throw "Packages must carry release version $env:RELEASE_VERSION; got [$($wrongVersion.Name -join ', ')]."
          }

      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: ./scripts/Push-NuGetRelease.ps1 -PackagesPath packages -ApiKey $env:NUGET_API_KEY

      - name: Attach packages to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" packages/*.nupkg packages/*.snupkg --clobber --repo "$GITHUB_REPOSITORY"
