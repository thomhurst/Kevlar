name: Stress tests

# The pull-request smoke run is part of CI (ci.yml), so the required `CI Passed`
# check covers it.
on:
  push:
    branches: [main]
    paths:
      - 'src/Kevlar/**'
      - 'benchmarks/Kevlar.StressTests/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/stress.yml'
      - '.github/workflows/stress-run.yml'
      - '.github/scripts/stress_docs.py'
      - '.github/scripts/publish_stress_docs.sh'
      - '.github/scripts/test_stress_publish.py'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  run-stress-test:
    name: Run 15-minute stress test
    uses: ./.github/workflows/stress-run.yml
    with:
      smoke: false

  publish-docs:
    name: Publish stress results to docs
    runs-on: ubuntu-latest
    needs: run-stress-test
    concurrency:
      group: stress-docs-main
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20

    permissions:
      contents: write
      actions: write

    steps:
      # Reruns must generate over the page already published by earlier attempts.
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Download results
        uses: actions/download-artifact@v8
        with:
          name: stress-results
          path: stress-results

      - name: Generate stress page
        run: >-
          python3 .github/scripts/stress_docs.py
          --input stress-results/stress-results.json
          --commit "${GITHUB_SHA::7}"
          --output docs/docs/stress-tests.md

      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish_stress_docs.sh
