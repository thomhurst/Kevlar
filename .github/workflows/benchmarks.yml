name: Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/benchmarks.yml'
      - '.github/scripts/benchmark_docs.py'
  schedule:
    - cron: '0 5 * * 1'  # Weekly refresh even without code changes
  workflow_dispatch:
    inputs:
      benchmark_filter:
        description: 'Benchmark filter; pinned comparisons also accept newline-separated filters'
        required: false
        default: '*'
      baseline_sha:
        description: 'Optional full baseline SHA for sequential baseline/candidate/baseline comparison using candidate fixtures'
        required: false
        default: ''
      copy_candidate_fixtures:
        description: 'Copy candidate fixtures to baseline; disable when comparing unchanged fixtures beside candidate-only APIs'
        type: boolean
        required: false
        default: true
      disassembly:
        description: 'Capture JIT disassembly during pinned comparisons'
        type: boolean
        required: false
        default: false
      comparison_launch_count:
        description: 'Measured process launches per comparison case (1-5); repeat to expose process/JIT variance'
        type: number
        required: false
        default: 1

permissions:
  contents: read

# Queue-jump stale runs: a newer push supersedes an in-flight run's results anyway.
# Manual workflow_dispatch runs are never cancelled.
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  run-benchmarks:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build benchmarks/Kevlar.Benchmarks/Kevlar.Benchmarks.csproj -c Release

      - name: Run Benchmarks
        if: inputs.baseline_sha == ''
        working-directory: benchmarks/Kevlar.Benchmarks
        run: >-
          dotnet run -c Release --no-build --
          --filter '${{ inputs.benchmark_filter || '*' }}'
          --exporters json
          --artifacts ./BenchmarkResults

      - name: Compare baseline and candidate
        if: inputs.baseline_sha != ''
        env:
          BASELINE_SHA: ${{ inputs.baseline_sha }}
          BENCHMARK_FILTER: ${{ inputs.benchmark_filter || '*' }}
          COPY_CANDIDATE_FIXTURES: ${{ inputs.copy_candidate_fixtures }}
          DISASSEMBLY: ${{ inputs.disassembly }}
          COMPARISON_LAUNCH_COUNT: ${{ inputs.comparison_launch_count || 1 }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t benchmark_filters <<< "$BENCHMARK_FILTER"
          diagnostics=()
          if [[ "$DISASSEMBLY" == "true" ]]; then diagnostics+=(--disasm --disasmDepth 4); fi
          [[ "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "baseline_sha must be a full commit SHA"; exit 1; }
          [[ "$COMPARISON_LAUNCH_COUNT" =~ ^[1-5]$ ]] || { echo "comparison_launch_count must be 1-5"; exit 1; }
          git fetch origin "$BASELINE_SHA"
          git worktree add --detach "$RUNNER_TEMP/benchmark-baseline" "$BASELINE_SHA"
          # Use identical candidate fixture source with each revision's product/build inputs.
          if [[ "$COPY_CANDIDATE_FIXTURES" != "false" ]]; then
            cp benchmarks/Kevlar.Benchmarks/*.cs "$RUNNER_TEMP/benchmark-baseline/benchmarks/Kevlar.Benchmarks/"
          fi
          baseline_project="$RUNNER_TEMP/benchmark-baseline/benchmarks/Kevlar.Benchmarks/Kevlar.Benchmarks.csproj"
          candidate_project="$GITHUB_WORKSPACE/benchmarks/Kevlar.Benchmarks/Kevlar.Benchmarks.csproj"
          results="$GITHUB_WORKSPACE/comparison-results"
          mkdir -p "$results"
          printf 'Baseline: %s\nCandidate: %s\nFilter: %s\n' "$BASELINE_SHA" "$GITHUB_SHA" "$BENCHMARK_FILTER" > "$results/revisions.txt"
          printf 'Process launches per case: %s\n' "$COMPARISON_LAUNCH_COUNT" >> "$results/revisions.txt"
          dotnet build "$baseline_project" -c Release
          for revision in baseline candidate; do
            project="$candidate_project"
            if [[ "$revision" == baseline ]]; then project="$baseline_project"; fi
            (cd "$(dirname "$project")" && dotnet run -c Release --no-build -- \
              --filter "${benchmark_filters[@]}" --job Dry --artifacts "$results/dry-$revision") \
              > "$results/dry-$revision.log" 2>&1
          done
          for phase in baseline-before candidate baseline-after; do
            project="$baseline_project"
            if [[ "$phase" == candidate ]]; then project="$candidate_project"; fi
            (cd "$(dirname "$project")" && dotnet run -c Release --no-build -- \
              --filter "${benchmark_filters[@]}" "${diagnostics[@]}" --launchCount "$COMPARISON_LAUNCH_COUNT" \
              --exporters json --artifacts "$results/$phase") \
              > "$results/$phase.log" 2>&1
          done

      - name: Write Run Summary
        run: |
          {
            echo "# Benchmark Results"
            echo
            if [[ -f comparison-results/revisions.txt ]]; then
              cat comparison-results/revisions.txt
              for phase in baseline-before candidate baseline-after; do
                echo "## $phase"
                cat comparison-results/"$phase"/results/*-report-github.md
                echo
              done
            else
              cat benchmarks/Kevlar.Benchmarks/BenchmarkResults/results/*-report-github.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            benchmarks/Kevlar.Benchmarks/BenchmarkResults/results/**
            comparison-results/**
          retention-days: 30

  benchmark-history:
    name: Store Benchmark History
    runs-on: ubuntu-latest
    needs: run-benchmarks
    if: github.ref == 'refs/heads/main' && inputs.baseline_sha == ''

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # github-action-benchmark cannot create its data branch itself; seed an
      # orphan branch on the very first run.
      - name: Ensure benchmark-data branch exists
        run: |
          if ! git ls-remote --exit-code --heads origin benchmark-data > /dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch --orphan benchmark-data
            git commit --allow-empty -m "chore: initialize benchmark data branch"
            git push origin benchmark-data
            git switch --detach ${{ github.sha }}
          fi

      - name: Download Results
        uses: actions/download-artifact@v8
        with:
          name: benchmark-results
          path: benchmark-results

      - name: Combine Results
        run: |
          python3 << 'EOF'
          import glob
          import json

          combined = {"Benchmarks": []}
          for path in sorted(glob.glob("benchmark-results/**/*-report-full-compressed.json", recursive=True)):
              print(f"Processing: {path}")
              with open(path) as fp:
                  data = json.load(fp)
              for bench in data.get("Benchmarks", []):
                  stats = bench.get("Statistics")
                  if stats is None or stats.get("Mean") is None:
                      continue
                  # github-action-benchmark reads Statistics.Mean; publish the median
                  # instead, which is a far more stable signal on shared runners.
                  if stats.get("Median") is not None:
                      stats["Mean"] = stats["Median"]
                  combined["Benchmarks"].append(bench)

          with open("combined.json", "w") as fp:
              json.dump(combined, fp)
          print(f"Combined {len(combined['Benchmarks'])} benchmarks")
          EOF

      - name: Store Results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Kevlar Benchmarks
          tool: 'benchmarkdotnet'
          output-file-path: combined.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: benchmark-data
          benchmark-data-dir-path: dev/bench
          auto-push: true
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@thomhurst'

  publish-docs:
    name: Publish Benchmarks to Docs
    runs-on: ubuntu-latest
    needs: [run-benchmarks, benchmark-history]
    # A filtered manual run only measures a subset, which would strip sections
    # from the generated page — publish only from full runs.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' ||
       inputs.benchmark_filter == '*' ||
       inputs.benchmark_filter == '')

    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v7

      - name: Download Results
        uses: actions/download-artifact@v8
        with:
          name: benchmark-results
          path: benchmark-results

      - name: Fetch Benchmark History
        run: |
          git fetch origin benchmark-data --depth=1
          git show FETCH_HEAD:dev/bench/data.js > "$RUNNER_TEMP/benchmark-data.js"

      - name: Generate Benchmarks Page
        run: >-
          python3 .github/scripts/benchmark_docs.py
          --results-dir benchmark-results
          --history "$RUNNER_TEMP/benchmark-data.js"
          --window 10
          --commit "${GITHUB_SHA::7}"
          --output docs/docs/benchmarks.md

      # A push made with GITHUB_TOKEN does not trigger the docs workflow's own
      # push event, so dispatch it explicitly after committing.
      - name: Commit and Deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet docs/docs/benchmarks.md; then
            echo "Benchmarks page unchanged; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/docs/benchmarks.md
          git commit -m "docs: update benchmark results [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run docs.yml --ref main
