name: Model tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/Kevlar/**'
      - 'tests/Kevlar.Tests/StrategyModelTests.cs'
      - 'tests/Kevlar.Tests/Infrastructure/ModelRunner.cs'
      - '.github/workflows/model-tests.yml'
  schedule:
    - cron: '17 3 * * 1-5'
  workflow_dispatch:
    inputs:
      seed_count:
        description: Additional deterministic seeds per model
        type: number
        required: false
        default: 250

permissions:
  contents: read

jobs:
  model-sweep:
    name: Deterministic model sweep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KEVLAR_MODEL_SWEEP_SEEDS: ${{ github.event.inputs.seed_count || '250' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Kevlar.slnx -c Release

      - name: Run deterministic model sweep
        run: dotnet run --project tests/Kevlar.Tests -c Release --no-build -- --timeout 10m --treenode-filter "/*/*/StrategyModelTests/*"
