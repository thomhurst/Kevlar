name: Release Draft

# Keeps one draft release up to date with main: its tag is the version GitVersion suggests for the
# newest commit (one patch above the latest release tag), its target is that commit, and its notes
# list the changes since the latest release (categorised by .github/release.yml).
#
# To release, edit the draft on GitHub: change the tag to choose the version (for example v1.6.0
# for a minor or v2.0.0 for a major release; a prerelease such as v2.0.0-beta.1 also works),
# adjust the notes, and publish it. Publishing creates the tag on the draft's commit and runs
# ci.yml, which tests and packs that commit with the tag's version and pushes the packages to NuGet.
#
# Every push to main rewrites the draft, so edits to it are lost if main moves before it is
# published. The draft this workflow owns carries DRAFT_MARKER, a hidden HTML comment, at the end
# of its notes; other drafts are left alone. Keep the marker when editing the draft: without it the
# next push creates a second draft. Publishing removes it from the release notes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Only the newest commit's draft matters.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  draft:
    name: Update draft release
    # A manual run on another branch would point main's draft at an unmerged commit.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      DRAFT_MARKER: '<!-- kevlar-release-draft -->'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Required for GitVersion
          persist-credentials: false

      - name: Resolve version
        id: version
        uses: ./.github/actions/resolve-version

      - name: Update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.semVer }}
        run: |
          set -euo pipefail
          repo="repos/$GITHUB_REPOSITORY"
          tag="v$VERSION"

          # A version is released once either accepted tag form (v1.2.3 or 1.2.3) exists; GitVersion
          # returns that version when the newest commit is the release's own. Nothing to draft
          # until main moves on.
          for existing in "v$VERSION" "$VERSION"; do
            if git ls-remote --exit-code --tags origin "refs/tags/$existing" > /dev/null; then
              echo "$VERSION is already released as $existing; leaving the draft alone." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            elif [ $? -ne 2 ]; then
              echo "::error::Could not look up tag $existing on origin."
              exit 1
            fi
          done

          # No published release yet (404) means notes start at the first commit; any other
          # failure fails the step.
          if latest=$(gh api "$repo/releases/latest" --jq .tag_name 2>&1); then
            previous_args=(-f previous_tag_name="$latest")
            previous="$latest"
          elif [[ "$latest" == *"(HTTP 404)"* ]]; then
            previous_args=()
            previous="(none)"
          else
            echo "::error::Could not read the latest release: $latest"
            exit 1
          fi

          notes=$(gh api -X POST "$repo/releases/generate-notes" \
            -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" "${previous_args[@]}" \
            --jq .body)
          body="$notes"$'\n\n'"$DRAFT_MARKER"

          draft_ids=$(gh api --paginate "$repo/releases?per_page=100" \
            --jq '.[] | select(.draft and ((.body // "") | contains(env.DRAFT_MARKER))) | .id')
          draft_id=${draft_ids%%$'\n'*}

          if [ -n "$draft_id" ]; then
            # Re-read the draft just before updating it: if it was published since the listing,
            # leave the release alone. The update never sends draft=true, so it cannot unpublish a
            # release; publishing in the sub-second gap between this check and the update could
            # still retarget the just-published release's notes and name, which ci.yml rewrites.
            still_draft=$(gh api "$repo/releases/$draft_id" --jq .draft)
            if [ "$still_draft" != "true" ]; then
              echo "Release $draft_id was published meanwhile; leaving it alone." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            url=$(gh api -X PATCH "$repo/releases/$draft_id" \
              -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="$VERSION" \
              -f body="$body" --jq .html_url)
          else
            url=$(gh api -X POST "$repo/releases" \
              -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="$VERSION" \
              -F draft=true -f body="$body" --jq .html_url)
          fi

          echo "Draft release $tag for $GITHUB_SHA (previous release $previous): $url" | tee -a "$GITHUB_STEP_SUMMARY"
