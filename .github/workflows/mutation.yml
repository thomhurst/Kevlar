name: Mutation testing

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/Kevlar/Strategies/**'
      - 'src/Kevlar/stryker-config.json'
      - 'tests/Kevlar.Tests/**'
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strategies:
    name: Core strategies
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Test strategy mutants
        working-directory: src/Kevlar
        run: dotnet stryker --config-file stryker-config.json

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: src/Kevlar/StrykerOutput/**/reports/
          if-no-files-found: error
          retention-days: 14
